<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Alchemy is a fantasy roguelite deckbuilder game." />
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 800;
        font-display: block;
        src: url(/fonts/Inter.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Expose the same CSS variables as index.css so the pre-React inline
         loader stays in sync with the app theme. */
      :root {
        --alchemy-bg: 30 10% 3%;
        --alchemy-fg: 40 25% 88%;
        --alchemy-border: 30 8% 16%;
        --alchemy-primary: 36 55% 56%;
      }
      html,
      body {
        background-color: hsl(var(--alchemy-bg));
        color: hsl(var(--alchemy-fg));
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
      }
    </style>
    <script type="module" src="/src/startup.ts"></script>
    <link rel="preload" as="font" href="/fonts/Inter.woff2" crossorigin />
    <title>Alchemy</title>
  </head>
  <body>
    <div id="root">
      <div style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        gap: 12px;
        background-color: hsl(var(--alchemy-bg));
        color: hsl(var(--alchemy-fg));
        font-family: 'Inter', sans-serif;
      ">
        <h1 style="
          font-size: 24px;
          font-weight: 800;
          text-transform: uppercase;
          letter-spacing: 0.15em;
          text-align: center;
          text-wrap: balance;
          color: rgba(254, 243, 199, 0.75);
          margin: 0;
          font-family: 'Inter', sans-serif;
        ">Alchemy</h1>
        <div style="
          height: 4px;
          width: 192px;
          background-color: hsl(var(--alchemy-border));
          border-radius: 9999px;
          overflow: hidden;
          position: relative;
        ">
          <div style="
            height: 100%;
            width: 40%;
            border-radius: 9999px;
            position: absolute;
            left: 0;
            top: 0;
            background: linear-gradient(
              90deg,
              hsl(var(--alchemy-primary) / 0) 0%,
              hsl(var(--alchemy-primary) / 0.35) 32%,
              hsl(var(--alchemy-primary)) 50%,
              hsl(var(--alchemy-primary) / 0.35) 68%,
              hsl(var(--alchemy-primary) / 0) 100%
            );
            will-change: transform;
            animation: alchemy-startup-comet 1.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
          "></div>
        </div>
        <p style="
          font-size: 12px;
          font-weight: 500;
          text-transform: uppercase;
          letter-spacing: 0.18em;
          text-align: center;
          color: hsl(var(--alchemy-fg) / 0.4);
          margin: 0;
        ">Loading...</p>
      </div>
      <style>
        /* translateX % is relative to the comet (40% of the 192px track).
           -100% starts fully off the left; 350% is track width + comet width off the right. */
        @keyframes alchemy-startup-comet {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(350%); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

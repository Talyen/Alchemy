<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Alchemy is a fantasy roguelite deckbuilder game." />
    <style>
      /* Expose the same CSS variables as index.css so the pre-React inline
         loading bar automatically stays in sync with the app theme. */
      :root {
        --alchemy-bg: 30 10% 3%;
        --alchemy-fg: 40 25% 88%;
        --alchemy-border: 30 8% 16%;
        --alchemy-primary: 36 55% 56%;
      }
      html,
      body {
        background-color: hsl(var(--alchemy-bg));
        color: hsl(var(--alchemy-fg));
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
      }
    </style>
    <script>
      (function() {
        try {
          if (localStorage.getItem("alchemy-disable-animations") === "true") {
            document.documentElement.classList.add("alchemy-disable-animations");
          }
          var saveRaw = localStorage.getItem("alchemy-save-v1");
          if (saveRaw) {
            var save = JSON.parse(saveRaw);
            if (save && save.uiScale) {
              var scaleFactor = String(Number(save.uiScale) / 100);
              document.documentElement.style.setProperty("--alchemy-ui-scale", scaleFactor);
            }
          }
        } catch (e) {
          console.warn("Failed to apply initial local storage styles", e);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block" />
    <title>Alchemy</title>
  </head>
  <body>
    <div id="root">
      <div style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        gap: 12px;
        background-color: hsl(var(--alchemy-bg));
        color: hsl(var(--alchemy-fg));
        font-family: 'Inter', sans-serif;
      ">
        <div style="
          height: 4px;
          width: 192px;
          background-color: hsl(var(--alchemy-border));
          border-radius: 9999px;
          overflow: hidden;
          position: relative;
        ">
          <div style="
            height: 100%;
            width: 100%;
            background-color: hsl(var(--alchemy-primary));
            border-radius: 9999px;
            position: absolute;
            left: 0;
            top: 0;
            transform-origin: left;
            animation: alchemy-startup-pulse 1200ms ease-in-out forwards;
          "></div>
        </div>
        <p style="
          font-size: 12px;
          font-weight: 500;
          text-transform: uppercase;
          letter-spacing: 0.18em;
          text-align: center;
          color: hsl(var(--alchemy-fg) / 0.4);
          margin: 0;
        ">Loading...</p>
      </div>
      <style>
        @keyframes alchemy-startup-pulse {
          0% { transform: scaleX(0); }
          70% { transform: scaleX(1); }
          100% { transform: scaleX(1); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

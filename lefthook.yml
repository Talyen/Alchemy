pre-commit:
  commands:
    lockfile-check:
      run: npm ci --dry-run
    typecheck:
      run: npm run typecheck
    format:
      glob: "src/**/*.{ts,tsx,css}"
      run: npx -y prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  piped: true
  commands:
    lockfile-check:
      run: npm ci --dry-run
    lint-ci:
      run: npm run lint:ci
    test:
      run: npm test
    build:
      run: npm run build:ship
    e2e-critical:
      run: npm run test:e2e:prepush

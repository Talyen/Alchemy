pre-commit:
  commands:
    format:
      # Formats staged files that match scripts/prettier-paths.mjs (same set as format:check).
      run: node scripts/run-prettier.mjs --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    lockfile-check:
      run: npm ci --dry-run
    fast-gate:
      # check:push:quick runs format, typecheck:all, lint, and a build with committed
      # assets — fast local gate (<60s). Use `npm run check:push` (includes prepush
      # E2E) before shipping, or set ALCHEMY_PREPUSH=1 to force full gate on push.
      run: npm run check:push:quick

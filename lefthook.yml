pre-commit:
  commands:
    lockfile-check:
      run: npm ci --dry-run
    typecheck:
      run: npm run typecheck
    format:
      # Formats staged files that match scripts/prettier-paths.mjs (same set as format:check).
      run: node scripts/run-prettier.mjs --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  piped: true
  commands:
    changelog-sync:
      run: node scripts/sync-changelog-commit.mjs
    lockfile-check:
      run: npm ci --dry-run
    lint-ci:
      run: npm run lint:ci
    test:
      run: npm test
    build:
      run: npm run build:ship
    e2e-critical:
      run: npm run test:e2e:prepush

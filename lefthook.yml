pre-commit:
  commands:
    lockfile-check:
      run: npm ci --dry-run
    format:
      glob: "src/**/*.{ts,tsx,css}"
      run: npx -y prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    lockfile-check:
      run: npm ci --dry-run
    format-check:
      run: npm run format:check
    lint:
      run: npm run lint
    test:
      run: npm test
    build:
      run: npm run build
    e2e-smoke:
      run: npm run test:e2e:smoke

post-commit:
  commands:
    changelog-sync:
      run: node scripts/sync-changelog-post-commit.mjs

pre-commit:
  commands:
    lockfile-check:
      run: npm ci --dry-run
    typecheck:
      run: npm run typecheck
    format:
      # Formats staged files that match scripts/prettier-paths.mjs (same set as format:check).
      run: node scripts/run-prettier.mjs --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  piped: true
  commands:
    changelog-sync:
      run: node scripts/sync-changelog-commit.mjs
    fast-gate:
      # Full lint, unit, build, and broad E2E gates run in CI or explicitly via
      # `npm run check:push:full`; keep the default hook fast for iteration.
      run: npm run check:push

pre-commit:
  commands:
    lockfile-check:
      run: npm ci --dry-run
    typecheck:
      run: npm run typecheck
    format:
      # Formats staged files that match scripts/prettier-paths.mjs (same set as format:check).
      run: node scripts/run-prettier.mjs --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    fast-gate:
      # check:push runs format, typecheck:all (src + tests), lint, a build with
      # committed assets, and the preview-mode prepush E2E — so the browser gate
      # always exercises a freshly built bundle, never stale dist/. Full lint:ci,
      # unit, and broad E2E gates still run in CI.
      run: npm run check:push

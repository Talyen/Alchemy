pre-commit:
  commands:
    format:
      # Formats staged files that match scripts/prettier-paths.mjs (same set as format:check).
      run: node scripts/run-prettier.mjs --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    push-gate:
      # check:push is the canonical fast gate: lockfile, format, typecheck, lint,
      # generated-output validation, and a non-mutating production build.
      run: npm run check:push

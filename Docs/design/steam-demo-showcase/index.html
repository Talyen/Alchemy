<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Alchemy feature showcase master</title>
    <style>
      @font-face {
        font-family: Inter;
        src: url("../../../public/fonts/Inter.woff2") format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 2560px;
        height: 1440px;
        overflow: hidden;
        background: #10100e;
      }
      body {
        padding: 32px;
        color: #f3e4ca;
        font-family: Inter, sans-serif;
      }
      .showcase {
        height: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 24px;
      }
      .panel {
        position: relative;
        min-width: 0;
        overflow: hidden;
        border: 2px solid #986b3280;
        border-radius: 28px;
        background: #161714;
      }
      .art {
        position: absolute;
        inset: 0 0 104px;
        overflow: hidden;
      }
      .art > img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .label {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 104px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #11120f;
        border-top: 2px solid #986b3270;
        font-size: 54px;
        font-weight: 650;
        letter-spacing: -1px;
        white-space: nowrap;
      }
      .portraits,
      .bosses {
        display: flex;
        height: 100%;
        gap: 4px;
        background: #161714;
      }
      .portraits img {
        width: calc((100% - 16px) / 5);
        height: 100%;
        object-fit: cover;
      }
      .bosses img {
        width: calc((100% - 4px) / 2);
        height: 100%;
        object-fit: cover;
      }
      .builds {
        background: radial-gradient(ellipse at center, #2b3027, #111612);
      }
      .cards {
        position: absolute;
        top: 27px;
        left: 100px;
        right: 100px;
        display: flex;
        justify-content: center;
        gap: 16px;
      }
      .cards img {
        width: 185px;
        height: 305px;
        object-fit: cover;
        border: 3px solid #cd9b5180;
        border-radius: 18px;
        box-shadow: 0 12px 20px #0008;
      }
      .cards img:first-child {
        transform: translateY(20px) rotate(-9deg);
      }
      .cards img:last-child {
        transform: translateY(20px) rotate(9deg);
      }
      .talents {
        position: absolute;
        bottom: 35px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 30px;
      }
      .talents img {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border: 3px solid #986b32;
        border-radius: 24px;
      }
      .progression {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .progression > img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .gear {
        position: absolute;
        bottom: 35px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 24px;
      }
      .gear img {
        width: 155px;
        height: 200px;
        object-fit: cover;
        border-radius: 18px;
        border: 3px solid #cd9b51;
        box-shadow: 0 12px 25px #000b;
      }
    </style>
  </head>
  <body>
    <main class="showcase">
      <section class="panel">
        <div class="art portraits">
          <img src="../../../Raw%20Assets/Heroes/Wizard.jpeg" alt="" />
          <img src="../../../Raw%20Assets/Heroes/Alchemist.jpeg" alt="" />
          <img src="../../../Raw%20Assets/Heroes/Warlock.jpeg" alt="" />
          <img src="../../../Raw%20Assets/Heroes/Druid.jpeg" alt="" />
          <img src="../../../Raw%20Assets/Heroes/Wildcard.jpeg" alt="" />
        </div>
        <div class="label">More Heroes</div>
      </section>
      <section class="panel">
        <div class="art bosses">
          <img src="../../../Raw%20Assets/Enemies/The%20Frostwarden.jpeg" alt="" />
          <img src="../../../Raw%20Assets/Enemies/The%20Blight%20Treant.jpeg" alt="" />
        </div>
        <div class="label">More Campaign Acts</div>
      </section>
      <section class="panel">
        <div class="art"><img src="../../../Raw%20Assets/Game%20Modes/The%20Labyrinth.jpeg" alt="" /></div>
        <div class="label">The Labyrinth</div>
      </section>
      <section class="panel">
        <div class="art"><img src="../../../Raw%20Assets/Game%20Modes/Wildwood%20Draft.jpeg" alt="" /></div>
        <div class="label">Wildwood Draft</div>
      </section>
      <section class="panel">
        <div class="art builds">
          <div class="cards">
            <img src="../../../Raw%20Assets/Cards/Fireball.jpeg" alt="" /><img
              src="../../../Raw%20Assets/Cards/Frostbolt.jpeg"
              alt=""
            /><img src="../../../Raw%20Assets/Cards/Poison%20Dagger.jpeg" alt="" />
          </div>
          <div class="talents">
            <img src="../../../Raw%20Assets/Talents/Burn.jpeg" alt="" /><img
              src="../../../Raw%20Assets/Talents/Freeze.jpeg"
              alt=""
            /><img src="../../../Raw%20Assets/Talents/Poison.jpeg" alt="" />
          </div>
        </div>
        <div class="label">Cards &amp; Talents</div>
      </section>
      <section class="panel">
        <div class="art progression">
          <img src="../../../Raw%20Assets/Homestead/Alchemy%20Lab.jpeg" alt="" /><img
            src="../../../Raw%20Assets/Homestead/Blacksmith%27s%20Forge.jpeg"
            alt=""
          />
          <div class="gear">
            <img src="../../../Raw%20Assets/Gear/Longsword%20-%20Astral.jpeg" alt="" /><img
              src="../../../Raw%20Assets/Gear/Plate%20Armor%20-%20Astral.jpeg"
              alt=""
            /><img src="../../../Raw%20Assets/Gear/Spellbook%20-%20Astral.jpeg" alt="" />
          </div>
        </div>
        <div class="label">Homestead &amp; Armory</div>
      </section>
    </main>
  </body>
</html>

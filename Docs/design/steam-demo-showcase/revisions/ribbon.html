<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Unapproved showcase ribbon</title>
    <style>
      @font-face {
        font-family: Inter;
        src: url("../../../../public/fonts/Inter.woff2") format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 2560px;
        height: 1440px;
        overflow: hidden;
        background: #0c0e0c;
        color: #f3e4ca;
        font-family: Inter, sans-serif;
      }
      body {
        padding: 32px;
      }
      .canvas {
        position: relative;
        width: 2496px;
        height: 1192px;
      }
      .panel {
        position: absolute;
        border: 2px solid #986b3280;
        border-radius: 28px;
        overflow: hidden;
        background: #141713;
      }
      .art {
        position: absolute;
        inset: 0 0 76px;
        overflow: hidden;
      }
      .label {
        position: absolute;
        inset: auto 0 0;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #11130f;
        border-top: 2px solid #986b3270;
        font-size: 52px;
        font-weight: 650;
        letter-spacing: -1px;
        white-space: nowrap;
      }
      .fragment {
        position: absolute;
        inset: 0;
        background: #101510;
      }
      .fragment img {
        position: absolute;
        max-width: none;
        object-fit: fill;
      }
      .bosses .art {
        display: flex;
        gap: 3px;
      }
      .bosses img {
        width: calc((100% - 18px) / 7);
        height: 100%;
        object-fit: cover;
        object-position: 50% 12%;
      }
      .mode img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .loot .art {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding: 22px;
        background: radial-gradient(ellipse at center, #29271f, #111612);
      }
      .loot img {
        width: 100%;
        height: 100%;
        min-height: 0;
        object-fit: cover;
        border: 2px solid #986b32;
        border-radius: 16px;
      }
      .loot .label {
        font-size: 36px;
        letter-spacing: -0.5px;
      }
      .home .art {
        display: flex;
        gap: 3px;
      }
      .home img {
        width: calc((100% - 6px) / 3);
        height: 100%;
        object-fit: cover;
      }
      .stats {
        margin-top: 24px;
        width: 2496px;
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: space-around;
        border-top: 2px solid #986b3290;
      }
      .stat {
        display: flex;
        align-items: baseline;
        gap: 20px;
      }
      .stat b {
        font-size: 78px;
        font-weight: 650;
        color: #e6c58e;
      }
      .stat span {
        font-size: 42px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <section class="panel" style="left: 0px; top: 0px; width: 2496px; height: 380px">
        <div class="art">
          <div class="fragment" style="clip-path: polygon(0 0, 22% 0, 18% 45%, 22% 67%, 18% 100%, 0 100%)">
            <img
              src="../../../../Raw%20Assets/Heroes/Wizard.jpeg"
              alt=""
              style="
                width: 912.5925925925926px;
                height: 1222.2222222222224px;
                left: -216.2222222222222px;
                top: -127.66666666666669px;
              "
            />
          </div>
          <div
            class="fragment"
            style="clip-path: polygon(22% 0, 42% 0, 38% 37%, 43% 62%, 38% 100%, 18% 100%, 22% 67%, 18% 45%)"
          >
            <img
              src="../../../../Raw%20Assets/Heroes/Alchemist.jpeg"
              alt=""
              style="
                width: 1059.784946236559px;
                height: 1419.3548387096776px;
                left: 164.71827956989262px;
                top: -225.8387096774194px;
              "
            />
          </div>
          <div
            class="fragment"
            style="clip-path: polygon(42% 0, 62% 0, 58% 48%, 63% 74%, 58% 100%, 38% 100%, 43% 62%, 38% 37%)"
          >
            <img
              src="../../../../Raw%20Assets/Heroes/Warlock.jpeg"
              alt=""
              style="width: 821.3333333333333px; height: 1100px; left: 835.3333333333334px; top: -36px"
            />
          </div>
          <div
            class="fragment"
            style="clip-path: polygon(62% 0, 82% 0, 78% 38%, 83% 65%, 78% 100%, 58% 100%, 63% 74%, 58% 48%)"
          >
            <img
              src="../../../../Raw%20Assets/Heroes/Druid.jpeg"
              alt=""
              style="
                width: 1020.332618025751px;
                height: 1374.9999999999998px;
                left: 1234.2336909871246px;
                top: -187.24999999999994px;
              "
            />
          </div>
          <div class="fragment" style="clip-path: polygon(82% 0, 100% 0, 100% 100%, 78% 100%, 83% 65%, 78% 38%)">
            <img
              src="../../../../Raw%20Assets/Heroes/Wildcard.jpeg"
              alt=""
              style="width: 821.3333333333333px; height: 1100px; left: 1832.1333333333337px; top: -135px"
            />
          </div>
        </div>
        <div class="label">More Heroes</div>
      </section>
      <section class="panel mode" style="left: 0px; top: 404px; width: 700px; height: 382px">
        <div class="art"><img src="../../../../Raw%20Assets/Game%20Modes/The%20Labyrinth.jpeg" alt="" style="" /></div>
        <div class="label">The Labyrinth</div>
      </section>
      <section class="panel mode" style="left: 0px; top: 810px; width: 700px; height: 382px">
        <div class="art"><img src="../../../../Raw%20Assets/Game%20Modes/Wildwood%20Draft.jpeg" alt="" style="" /></div>
        <div class="label">Wildwood Draft</div>
      </section>
      <section class="panel bosses" style="left: 724px; top: 404px; width: 1024px; height: 788px">
        <div class="art">
          <img src="../../../../Raw%20Assets/Enemies/The%20Forge%20Golem.jpeg" alt="" style="" /><img
            src="../../../../Raw%20Assets/Enemies/The%20Frostwarden.jpeg"
            alt=""
            style=""
          /><img src="../../../../Raw%20Assets/Enemies/The%20Blight%20Treant.jpeg" alt="" style="" /><img
            src="../../../../Raw%20Assets/Enemies/The%20Iron%20Bear.jpeg"
            alt=""
            style=""
          /><img src="../../../../Raw%20Assets/Enemies/The%20Blood%20Countess.jpeg" alt="" style="" /><img
            src="../../../../Raw%20Assets/Enemies/The%20Seraph.jpeg"
            alt=""
            style=""
          /><img src="../../../../Raw%20Assets/Enemies/The%20Stone%20Titan.jpeg" alt="" style="" />
        </div>
        <div class="label">Boss Battles</div>
      </section>
      <section class="panel loot" style="left: 1772px; top: 404px; width: 724px; height: 382px">
        <div class="art">
          <img src="../../../../Raw%20Assets/Trinkets/Brass%20Censer.jpeg" alt="" style="" /><img
            src="../../../../Raw%20Assets/Trinkets/Sin-Eater's%20Lantern.jpeg"
            alt=""
            style=""
          /><img src="../../../../Raw%20Assets/Gear/Flail%20-%20Astral.jpeg" alt="" style="" /><img
            src="../../../../Raw%20Assets/Gear/Emerald%20Amulet%20-%20Astral.jpeg"
            alt=""
            style=""
          /><img src="../../../../Raw%20Assets/Crafting/Discordant%20Dice.png" alt="" style="" /><img
            src="../../../../Raw%20Assets/Crafting/Smith's%20Whetstone.png"
            alt=""
            style=""
          />
        </div>
        <div class="label">Boons, Trinkets, Uniques, Crafting</div>
      </section>
      <section class="panel home" style="left: 1772px; top: 810px; width: 724px; height: 382px">
        <div class="art">
          <img src="../../../../Raw%20Assets/Homestead/Alchemy%20Lab.jpeg" alt="" style="" /><img
            src="../../../../Raw%20Assets/Homestead/Companion%20Sanctuary.jpeg"
            alt=""
            style=""
          /><img src="../../../../Raw%20Assets/Homestead/Orchard.jpeg" alt="" style="" />
        </div>
        <div class="label">Homestead</div>
      </section>
    </main>
    <div class="stats">
      <div class="stat"><b>100+</b><span>Cards</span></div>
      <div class="stat"><b>200+</b><span>Talents</span></div>
      <div class="stat"><b>25+</b><span>Uniques</span></div>
      <div class="stat"><b>20+</b><span>Trinkets</span></div>
    </div>
  </body>
</html>

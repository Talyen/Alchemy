<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Draft boss-gallery</title>
    <style>
      @font-face {
        font-family: Inter;
        src: url("../../../../../public/fonts/Inter.woff2") format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 2560px;
        height: 1440px;
        background: #0c0e0c;
        color: #f3e4ca;
        overflow: hidden;
        font-family: Inter, sans-serif;
      }
      body {
        padding: 32px;
      }
      .canvas {
        position: relative;
        width: 2496px;
        height: 1376px;
      }
      .panel {
        position: absolute;
        border: 2px solid #986b3280;
        border-radius: 28px;
        background: #141713;
        overflow: hidden;
      }
      .art {
        position: absolute;
        inset: 0 0 104px;
        overflow: hidden;
      }
      .label {
        position: absolute;
        inset: auto 0 0;
        height: 104px;
        background: #11130f;
        border-top: 2px solid #986b3270;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
        font-size: 48px;
        font-weight: 650;
        letter-spacing: -1px;
      }
      .label small {
        font-size: 32px;
        color: #e6c58e;
        font-weight: 500;
        letter-spacing: 0;
      }
      .fragment {
        position: absolute;
        inset: 0;
        background: #101510;
      }
      .fragment img {
        position: absolute;
        max-width: none;
      }
      .bosses .art {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 12px;
      }
      .boss {
        width: calc((100% - 36px) / 7);
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boss img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 35%;
      }
      .mode img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .loot .art {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 20px;
        background: radial-gradient(ellipse at center, #29271f, #111612);
      }
      .item {
        width: calc((100% - 48px) / 4);
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .item img {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border: 2px solid #986b32;
        border-radius: 14px;
      }
      .loot .label {
        font-size: 32px;
        letter-spacing: -0.4px;
      }
      .home .art {
        display: flex;
        gap: 4px;
      }
      .home img {
        width: calc((100% - 8px) / 3);
        height: 100%;
        object-fit: cover;
      }
      .draft .art {
        position: absolute;
        background: radial-gradient(ellipse at center, #30342a, #111513);
      }
      .draft img {
        position: absolute;
        object-fit: contain;
        height: 80%;
        width: 22%;
        top: 10%;
        left: calc(1% + var(--i) * 15.2%);
        transform: rotate(calc((var(--i) - 2.5) * 5deg));
        filter: drop-shadow(0 8px 6px #000a);
      }
      .draft img:first-child,
      .draft img:last-child {
        height: 64%;
        top: 18%;
      }
      .hero .label {
        font-size: 46px;
      }
      .hero .label small {
        font-size: 29px;
      }
    </style>
    <style>
      .label small {
        display: none;
      }
      .panel {
        background: transparent;
      }
      .item img {
        border: 0;
        border-radius: 8px;
      }
      .loot .art {
        background: radial-gradient(ellipse at center, #1c211a, #0c0e0c);
      }
      .hero .label {
        font-size: 46px;
      }
      .label {
        font-size: 46px;
      }
      .panel {
        border: 0;
        border-radius: 0;
      }
      .art {
        inset: 0;
      }
      .label {
        height: 72px;
        border: 0;
        background: linear-gradient(transparent, #0c0e0ce8 65%);
        justify-content: flex-end;
        padding-bottom: 7px;
        text-shadow: 0 2px 5px #000;
      }
      .bosses .art {
        padding: 0;
        gap: 2px;
      }
      .hero .art {
        mask-image: linear-gradient(to bottom, #000 91%, transparent);
      }
      .mode .art,
      .home .art {
        mask-image: linear-gradient(to bottom, #000 80%, transparent);
      }
      .loot .label {
        font-size: 32px;
      }
    </style>
  </head>
  <body>

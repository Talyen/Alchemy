<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Draft expanded-mosaic</title>
    <style>
      @font-face {
        font-family: Inter;
        src: url("../../../../../public/fonts/Inter.woff2") format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 2560px;
        height: 1440px;
        background: #0c0e0c;
        color: #f3e4ca;
        overflow: hidden;
        font-family: Inter, sans-serif;
      }
      body {
        padding: 32px;
      }
      .canvas {
        position: relative;
        width: 2496px;
        height: 1376px;
      }
      .panel {
        position: absolute;
        border: 2px solid #986b3280;
        border-radius: 28px;
        background: #141713;
        overflow: hidden;
      }
      .art {
        position: absolute;
        inset: 0 0 104px;
        overflow: hidden;
      }
      .label {
        position: absolute;
        inset: auto 0 0;
        height: 104px;
        background: #11130f;
        border-top: 2px solid #986b3270;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
        font-size: 48px;
        font-weight: 650;
        letter-spacing: -1px;
      }
      .label small {
        font-size: 32px;
        color: #e6c58e;
        font-weight: 500;
        letter-spacing: 0;
      }
      .fragment {
        position: absolute;
        inset: 0;
        background: #101510;
      }
      .fragment img {
        position: absolute;
        max-width: none;
      }
      .bosses .art {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 12px;
      }
      .boss {
        width: calc((100% - 36px) / 7);
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boss img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 35%;
      }
      .mode img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .loot .art {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 20px;
        background: radial-gradient(ellipse at center, #29271f, #111612);
      }
      .item {
        width: calc((100% - 48px) / 4);
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .item img {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border: 2px solid #986b32;
        border-radius: 14px;
      }
      .loot .label {
        font-size: 32px;
        letter-spacing: -0.4px;
      }
      .home .art {
        display: flex;
        gap: 4px;
      }
      .home img {
        width: calc((100% - 8px) / 3);
        height: 100%;
        object-fit: cover;
      }
      .draft .art {
        position: absolute;
        background: radial-gradient(ellipse at center, #30342a, #111513);
      }
      .draft img {
        position: absolute;
        object-fit: contain;
        height: 80%;
        width: 22%;
        top: 10%;
        left: calc(1% + var(--i) * 15.2%);
        transform: rotate(calc((var(--i) - 2.5) * 5deg));
        filter: drop-shadow(0 8px 6px #000a);
      }
      .draft img:first-child,
      .draft img:last-child {
        height: 64%;
        top: 18%;
      }
      .hero .label {
        font-size: 46px;
      }
      .hero .label small {
        font-size: 29px;
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <section class="panel hero" style="left: 0px; top: 0px; width: 704px; height: 1376px">
        <div class="art">
          <div class="fragment" style="clip-path: polygon(0 0, 53% 0, 46% 24%, 0 27%)">
            <img
              src="../../../../../Raw%20Assets/Heroes/Knight.jpeg"
              alt=""
              style="
                width: 790.5882352941176px;
                height: 1058.8235294117646px;
                left: -220.29411764705878px;
                top: -33.134117647058815px;
              "
            />
          </div>
          <div class="fragment" style="clip-path: polygon(53% 0, 100% 0, 100% 23%, 46% 24%)">
            <img
              src="../../../../../Raw%20Assets/Heroes/Wizard.jpeg"
              alt=""
              style="width: 746.6666666666667px; height: 1000px; left: 144.19999999999993px; top: -57.84px"
            />
          </div>
          <div class="fragment" style="clip-path: polygon(0 27%, 46% 24%, 56% 50%, 0 48%)">
            <img
              src="../../../../../Raw%20Assets/Heroes/Rogue.jpeg"

              style="width: 640px; height: 857.1428571428571px; left: -183.40000000000003px; top: 254.8742857142857px"
            />
          </div>
          <div class="fragment" style="clip-path: polygon(46% 24%, 100% 23%, 100% 52%, 56% 50%)">
            <img
              src="../../../../../Raw%20Assets/Heroes/Alchemist.jpeg"
              alt=""
              style="
                width: 867.0967741935484px;
                height: 1161.2903225806451px;
                left: 48.096774193548356px;
                top: 178.8374193548387px;
              "
            />
          </div>
          <div class="fragment" style="clip-path: polygon(0 48%, 56% 50%, 48% 76%, 0 75%)">
            <img
              src="../../../../../Raw%20Assets/Heroes/Ranger.jpeg"
              alt=""
              style="width: 768px; height: 1028.5714285714284px; left: -170.60000000000002px; top: 523.8742857142856px"
            />
          </div>
          <div class="fragment" style="clip-path: polygon(56% 50%, 100% 52%, 100% 74%, 48% 76%)">
            <img
              src="../../../../../Raw%20Assets/Heroes/Warlock.jpeg"
              alt=""
              style="width: 672px; height: 900px; left: 189px; top: 651.16px"
            />
          </div>
          <div class="fragment" style="clip-path: polygon(0 75%, 48% 76%, 55% 100%, 0 100%)">
            <img
              src="../../../../../Raw%20Assets/Heroes/Druid.jpeg"
              alt=""
              style="width: 834.8175965665235px; height: 1125px; left: -242.40879828326177px; top: 844.4100000000001px"
            />
          </div>
          <div class="fragment" style="clip-path: polygon(48% 76%, 100% 74%, 100% 100%, 55% 100%)">
            <img
              src="../../../../../Raw%20Assets/Heroes/Wildcard.jpeg"
              alt=""
              style="width: 672px; height: 900px; left: 189px; top: 887.1600000000001px"
            />
          </div>
        </div>
        <div class="label"><span>Heroes</span><small>8+ Heroes · 200+ Talents</small></div>
      </section>
      <section class="panel bosses" style="left: 728px; top: 0px; width: 1768px; height: 536px">
        <div class="art">
          <div class="boss">
            <img src="../../../../../Raw%20Assets/Enemies/The%20Forge%20Golem.jpeg" alt="" style="" />
          </div>
          <div class="boss">
            <img src="../../../../../Raw%20Assets/Enemies/The%20Frostwarden.jpeg" alt="" style="" />
          </div>
          <div class="boss">
            <img src="../../../../../Raw%20Assets/Enemies/The%20Blight%20Treant.jpeg" alt="" style="" />
          </div>
          <div class="boss">
            <img src="../../../../../Raw%20Assets/Enemies/The%20Iron%20Bear.jpeg" alt="" style="" />
          </div>
          <div class="boss">
            <img src="../../../../../Raw%20Assets/Enemies/The%20Blood%20Countess.jpeg" alt="" style="" />
          </div>
          <div class="boss"><img src="../../../../../Raw%20Assets/Enemies/The%20Seraph.jpeg" alt="" style="" /></div>
          <div class="boss">
            <img src="../../../../../Raw%20Assets/Enemies/The%20Stone%20Titan.jpeg" alt="" style="" />
          </div>
        </div>
        <div class="label"><span>Boss Battles</span><small>7+ Bosses</small></div>
      </section>
      <section class="panel mode" style="left: 728px; top: 560px; width: 872px; height: 356px">
        <div class="art">
          <img src="../../../../../Raw%20Assets/Game%20Modes/The%20Labyrinth.jpeg" alt="" style="" />
        </div>
        <div class="label"><span>The Labyrinth</span></div>
      </section>
      <section class="panel draft" style="left: 1624px; top: 560px; width: 872px; height: 356px">
        <div class="art">
          <img src="../../../../../Raw%20Assets/Misc/Draw%20Pile.png" alt="" style="--i: 0" /><img
            src="../../../../../Raw%20Assets/Cards/Slash.jpeg"
            alt=""
            style="--i: 1"
          /><img src="../../../../../Raw%20Assets/Cards/Fireball.jpeg" alt="" style="--i: 2" /><img
            src="../../../../../Raw%20Assets/Cards/Frostbolt.jpeg"
            alt=""
            style="--i: 3"
          /><img src="../../../../../Raw%20Assets/Cards/Poison%20Dagger.jpeg" alt="" style="--i: 4" /><img
            src="../../../../../Raw%20Assets/Misc/Discard%20Pile.png"
            alt=""
            style="--i: 5"
          />
        </div>
        <div class="label"><span>Wildwood Draft</span><small>100+ Cards</small></div>
      </section>
      <section class="panel loot" style="left: 728px; top: 940px; width: 872px; height: 436px">
        <div class="art">
          <div class="item"><img src="../../../../../Raw%20Assets/Trinkets/Brass%20Censer.jpeg" alt="" style="" /></div>
          <div class="item">
            <img src="../../../../../Raw%20Assets/Trinkets/Sin-Eater's%20Lantern.jpeg" alt="" style="" />
          </div>
          <div class="item"><img src="../../../../../Raw%20Assets/Gear/Flail%20-%20Astral.jpeg" alt="" style="" /></div>
          <div class="item">
            <img src="../../../../../Raw%20Assets/Crafting/Discordant%20Dice.png" alt="" style="" />
          </div>
        </div>
        <div class="label">
          <span>Boons, Trinkets, Uniques, Crafting</span><small>25+ Uniques · 20+ Trinkets</small>
        </div>
      </section>
      <section class="panel home" style="left: 1624px; top: 940px; width: 872px; height: 436px">
        <div class="art">
          <img src="../../../../../reports/demo-showcase-revisions/wheat-field.png" alt="" style="" /><img
            src="../../../../../Raw%20Assets/Homestead/Blacksmith's%20Forge.jpeg"
            alt=""
            style=""
          /><img src="../../../../../Raw%20Assets/Homestead/Library.jpeg" alt="" style="" />
        </div>
        <div class="label"><span>Homestead</span><small>20+ Upgrades</small></div>
      </section>
    </main>
  </body>
</html>

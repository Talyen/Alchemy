<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="17" stitchTiles="stitch"/>
    <!-- Fixed brown pigment; noise varies coverage instead of adding gray light. -->
    <feColorMatrix type="matrix" values="0 0 0 0 0.267
                                        0 0 0 0 0.145
                                        0 0 0 0 0.055
                                        1.4 0 0 0 -0.4"/>
  </filter>
  <path fill="#fff" filter="url(#grain)" d="M0 0h128v128H0z"/>
</svg>

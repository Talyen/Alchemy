name: Shared web-build
on:
  workflow_call:
    inputs:
      diagnostics:
        type: string
        required: true
      release:
        type: boolean
        default: false
      acceptance:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            /*
            !/assets/sources/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup
      - name: Verify release tag matches package.json
        run: node scripts/verify-release.mjs --skip-package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        if: ${{ inputs.release }}
      - run: npm run build
      - run: npm run check:bundle
        if: ${{ inputs.acceptance }}
      - name: Smoke test production build
        run: npm run smoke:preview
        if: ${{ inputs.acceptance }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/
          compression-level: 0
          retention-days: 1
      - name: Retain build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.diagnostics }}
          path: |
            reports/compact/
            reports/current-run.*
            reports/runs/
          retention-days: 1
          if-no-files-found: ignore

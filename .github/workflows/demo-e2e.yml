name: Shared demo acceptance
on:
  workflow_call:
    inputs:
      artifact:
        type: string
        required: true
      full:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  demo-e2e:
    runs-on: ubuntu-latest
    env:
      ALCHEMY_EDITION: demo
      ALCHEMY_LOCALIZATION_LAYOUT_REVIEW: "1"
    steps:
      - name: Record test job setup start
        run: echo "ALCHEMY_CI_SETUP_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/assets/sources/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-playwright
      - run: npm run build:desktop
      - run: npm run check:bundle
      - name: Qualify production demo and localized endings
        run: npm run test:e2e -- tests/e2e/specs/steam-demo.spec.ts tests/e2e/specs/localization-demo.spec.ts --grep "${{ inputs.full && '.*' || '@critical|@localization-smoke' }}"
      - name: Ensure Electron binary
        run: node scripts/ensure-electron.mjs
      - name: Qualify native localized quit and resume
        run: xvfb-run -a npm run test:ship:desktop -- tests/electron/localization-demo.spec.ts
        env:
          PLAYWRIGHT_ELECTRON_FULL: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: ${{ inputs.artifact }}
          path: |
            playwright-report/
            test-results/
            reports/
          retention-days: 1

name: Headless playthroughs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playthrough-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run test:playthrough
      - run: npm run balance:playthrough -- --seeds 1,2 --runs 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: headless-playthroughs
          path: reports/playthrough/
          retention-days: 1
          if-no-files-found: ignore

name: Headless playthroughs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playthrough-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - run: npm run test:playthrough
      - run: npm run balance:playthrough -- --seeds 1,2 --runs 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: headless-playthroughs
          path: reports/playthrough/
          retention-days: 1
          if-no-files-found: ignore

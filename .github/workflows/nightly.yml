name: Nightly Production E2E

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  e2e-web:
    name: Web production E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $attempt), retrying in 15s..."
            sleep 15
          done
          exit 1

      - run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (with system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: npx playwright install chromium

      - name: Playwright install diagnostics
        if: failure()
        run: |
          npx playwright install --dry-run || true
          ls -la ~/.cache/ms-playwright || true

      - name: Run full e2e against production build
        run: npm run test:e2e:preview
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-nightly-web
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-electron:
    name: Electron desktop smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11

      - name: Cache Electron download
        uses: actions/cache@v5
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && node node_modules/electron/install.js && node -e "require('electron')" && exit 0
            echo "npm ci failed (attempt $attempt), retrying in 15s..."
            sleep 15
          done
          exit 1

      - run: npm run compile:desktop

      - name: Run Electron smoke tests
        run: xvfb-run --auto-servernum -- npm run test:e2e:electron
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-nightly-electron
          path: |
            playwright-report/
            test-results/
          retention-days: 7

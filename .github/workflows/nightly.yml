name: Nightly Production E2E

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup

      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          compression-level: 0
          retention-days: 1

  e2e-web:
    name: Web E2E (${{ matrix.shard }}/4)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALCHEMY_RUN_VARIANT: shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Smoke test downloaded build including music
        run: npm run smoke:preview

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - name: Prepare reports dir
        run: mkdir -p reports

      - name: Run web e2e shard
        run: npm run test:e2e:nightly -- --shard=${{ matrix.shard }}/4
        env:
          CI: true

      - name: Summarize web e2e shard
        id: playwright-summary
        if: always()
        run: node scripts/ci-summarize.mjs --playwright

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nightly-web-${{ matrix.shard }}-results
          path: reports/playwright-results.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure() || steps.playwright-summary.outputs.retain-diagnostics == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nightly-web-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            reports/playwright-results.json
            reports/current-run.*
            reports/runs/
          retention-days: 7

  ship-gate-full:
    name: Ship gate (full)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - uses: actions/cache@v6
        id: electron-binary-cache
        with:
          path: |
            ~/.cache/electron
            node_modules/electron/dist
            node_modules/electron/path.txt
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Electron binary
        run: node scripts/ensure-electron.mjs

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - run: npm run check:ship

      - name: Run save journeys
        run: npm run test:ship:e2e

      # Preserve this run before Electron replaces Playwright's output directories.
      - name: Summarize save journeys
        id: save-summary
        if: always()
        run: node scripts/ci-summarize.mjs --playwright

      - name: Upload save results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nightly-save-results
          path: reports/playwright-results.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload save diagnostics
        if: failure() || steps.save-summary.outputs.retain-diagnostics == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nightly-save
          path: |
            playwright-report/
            test-results/
            reports/playwright-results.json
            reports/current-run.*
            reports/runs/
          retention-days: 7

      - run: mkdir -p reports

      - name: Run Electron e2e
        run: xvfb-run --auto-servernum -- npm run test:ship:desktop
        env:
          CI: true

      - name: Summarize Electron e2e
        id: playwright-summary
        if: always()
        run: node scripts/ci-summarize.mjs --playwright reports/playwright-electron-results.json

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nightly-electron-results
          path: reports/playwright-electron-results.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Electron Playwright report
        if: failure() || steps.playwright-summary.outputs.retain-diagnostics == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nightly-electron
          path: |
            playwright-report/
            test-results/
            reports/playwright-electron-results.json
            reports/current-run.*
            reports/runs/
          retention-days: 7

  deadcode-entry-exports:
    name: Knip entry exports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup

      - name: Knip entry exports
        run: npm run deadcode:entry-exports

  coverage:
    name: Unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup

      - run: mkdir -p reports
      - name: Unit tests with coverage (thresholds in vite.config.ts)
        run: npm run test:coverage

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  mutation:
    name: Battle mutation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup

      - run: mkdir -p reports
      - name: Mutate battle damage calculation
        run: npm run test:mutation

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7
          if-no-files-found: ignore

name: Nightly Production E2E

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
        with:
          skip-electron-download: "true"

      - name: Cache Electron binary
        uses: actions/cache@v6
        id: electron-binary-cache
        with:
          path: |
            ~/.cache/electron
            node_modules/electron/dist
            node_modules/electron/path.txt
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Electron binary
        timeout-minutes: 15
        run: node scripts/ensure-electron.mjs

      - run: npm run build
        env:
          ALCHEMY_SKIP_ASSETS: "1"

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: |
            dist/
            !dist/Music/
          retention-days: 1

  e2e-web:
    name: Web E2E (${{ matrix.shard }}/4)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
        with:
          skip-electron-download: "true"

      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - name: Prepare reports dir
        run: mkdir -p reports

      - name: Run web e2e shard
        run: npm run test:e2e:nightly -- --shard=${{ matrix.shard }}/4
        env:
          CI: true

      - name: Summarize web e2e shard
        if: always()
        run: node scripts/ci-summarize-playwright.mjs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-nightly-web-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            reports/playwright-results.json
          retention-days: 3

  ship-gate-full:
    name: Ship gate (full)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
        with:
          skip-electron-download: "true"

      - uses: actions/cache/restore@v6
        id: electron-binary-cache
        with:
          path: |
            ~/.cache/electron
            node_modules/electron/dist
            node_modules/electron/path.txt
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Electron binary
        run: node scripts/ensure-electron.mjs

      - run: node scripts/sync-version-metadata.mjs
      - run: npm run check:ship:full

  deadcode-strict:
    name: Knip strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
        with:
          skip-electron-download: "true"

      - name: Knip strict (entry exports)
        run: npm run deadcode:strict

  notify-failure:
    name: Notify on failure
    needs: [e2e-web, ship-gate-full, deadcode-strict]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly-failure --color B60205 --description "Nightly workflow failed" --force
          existing=$(gh issue list --label nightly-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Nightly run failed again: $RUN_URL"
          else
            gh issue create \
              --title "Nightly Production E2E failed" \
              --label nightly-failure \
              --body "Nightly run failed: $RUN_URL"
          fi

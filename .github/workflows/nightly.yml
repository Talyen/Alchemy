name: Nightly Production E2E

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      discovery_cycle:
        description: "Replay a prior run number's performance seeds (0 uses this run)"
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  localization-qa:
    uses: ./.github/workflows/localization-qa.yml

  prepare:
    name: Prepare build
    uses: ./.github/workflows/web-build.yml
    with:
      diagnostics: build-diagnostics-nightly-prepare
      acceptance: false
      timeout: 15

  e2e-web:
    name: Web E2E (${{ matrix.shard }}/4)
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    uses: ./.github/workflows/web-e2e.yml
    with:
      command: npm run test:e2e:nightly -- --shard=${{ matrix.shard }}/4
      artifact: playwright-report-nightly-web-${{ matrix.shard }}
      timeout: 15
      variant: shard-${{ matrix.shard }}
      layout-review: true

  performance-discovery:
    name: Seeded desktop performance discovery (${{ matrix.slot }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - slot: 0
            workload: campfire-brewing
            extreme: inventory-200
          - slot: 1
            workload: transmutation-journey
            extreme: combat-feedback-burst
          - slot: 2
            workload: crafting-journey
            extreme: large-deck
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            /*
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Ensure Electron binary
        run: npm run ensure:electron

      - name: Install Electron system dependencies
        run: npx playwright install-deps chromium

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright
        with:
          install-deps: "false"

      - name: Select rotating seed
        id: seed
        run: |
          seed=$(node --input-type=module -e "import { selectDiscoverySeed } from './performance/case-selection.mjs'; console.log(selectDiscoverySeed(${{ inputs.discovery_cycle || github.run_number }}, ${{ matrix.slot }}));")
          echo "value=$seed" >> "$GITHUB_OUTPUT"

      - name: Run seeded journey
        run: xvfb-run --auto-servernum -- npm run perf -- --suite seeded --seed ${{ steps.seed.outputs.value }} --electron --skip-build
        env:
          CI: true

      - name: Profile non-combat transaction
        run: xvfb-run --auto-servernum -- npm run perf -- --scenario ${{ matrix.workload }} --electron --skip-build
        env:
          CI: true

      - name: Profile extreme player workload
        run: xvfb-run --auto-servernum -- npm run perf -- --scenario ${{ matrix.extreme }} --electron --skip-build
        env:
          CI: true

      - name: Verify generated checkpoint replay
        if: matrix.slot == 0
        run: xvfb-run --auto-servernum -- npm run perf -- --scenario campaign-early --electron --skip-build
        env:
          CI: true

      - name: Gameplay resource soak
        if: matrix.slot == 0
        run: xvfb-run --auto-servernum -- npm run perf -- --scenario memory-soak --electron --skip-build
        env:
          CI: true
          PERF_MEASURE_MS: "300000"
          PERF_SOAK_MIN_CYCLES: "20"
          PERF_RUNS: "1"

      - name: Upload replay and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-discovery-${{ steps.seed.outputs.value }}
          path: |
            reports/performance/
            reports/current-run.*
          retention-days: 1
          if-no-files-found: ignore

  ship-gate-full:
    name: Ship gate (full)
    uses: ./.github/workflows/electron-e2e.yml
    with:
      artifact: playwright-report-nightly-electron
      renderer: ""
      timeout: 45
      full: true

  deadcode-entry-exports:
    name: Knip entry exports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            /*
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup

      - name: Knip entry exports
        run: npm run deadcode:entry-exports

  coverage:
    name: Unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            /*
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup

      - run: mkdir -p reports
      - name: Unit tests with coverage and deeper interaction sequences
        run: npm run test:coverage
        env:
          ALCHEMY_INTERACTION_TIER: nightly

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: coverage-report
          path: |
            coverage/
            reports/runs/
            reports/compact/
          retention-days: 1

      - name: Retain interaction seed manifests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: interaction-seeds-nightly
          path: reports/runs/**/interaction/*-seeds.json
          retention-days: 1
          if-no-files-found: ignore

  mutation:
    name: Battle mutation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            /*
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup

      - run: mkdir -p reports
      - name: Mutate battle damage calculation
        run: npm run test:mutation

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 1
          if-no-files-found: ignore

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      save: ${{ steps.filter.outputs.save }}
      desktop: ${{ steps.filter.outputs.desktop }}
      desktop_renderer: ${{ steps.filter.outputs.desktop_renderer }}
      assets: ${{ steps.filter.outputs.assets }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      # workflow_dispatch has no diff base; gated jobs run unconditionally there.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            save:
              - "src/lib/validation/**"
              - "src/features/alchemy/shared/storage/**"
              - "src/lib/active-run-session/**"
              - "src/lib/platform.ts"
              - "src/features/alchemy/shared/stores/run-transitions*"
              - "src/features/alchemy/shared/stores/run-domain-store*"
              - "src/features/alchemy/shell/use-alchemy-run-controller*"
              - "tests/fixtures/legacy-saves*"
              - "tests/e2e/mid-combat-save*"
              - "tests/save-*"
            desktop:
              - "desktop/**"
              - "index.html"
              - "src/main.tsx"
              - "src/lib/platform.ts"
              - "src/lib/desktop-api.ts"
              - "src/lib/settings-values.ts"
              - "src/lib/crash-reporting.ts"
              - "src/features/alchemy/shared/storage/**"
              - "vite.config.ts"
              - "package.json"
              - "steam/**"
              - "scripts/dist-desktop*"
              - "scripts/lib/desktop-artifact*"
              - "scripts/verify-desktop-package*"
              - "scripts/sync-steam-appid*"
            desktop_renderer:
              - "desktop/**"
              - "index.html"
              - "src/main.tsx"
              - "src/App.tsx"
              - "src/app/**"
              - "src/lib/platform.ts"
              - "src/lib/desktop-api.ts"
              - "src/lib/settings-values.ts"
              - "src/lib/crash-reporting.ts"
              - "src/lib/routing/**"
              - "src/features/alchemy/shell/**"
              - "src/features/alchemy/shared/storage/**"
              - "src/features/alchemy/shared/stores/**"
              - "src/features/alchemy/meta/screens/**"
              - "src/features/alchemy/run-setup/screens/**"
              - "src/features/alchemy/run-loop/screens/**"
              - "tests/electron-*"
              - "playwright.electron*"
              - "vite.config.ts"
              - "package.json"
              - "scripts/prepare-assets.mjs"
              - "scripts/electron-path*"
              - "scripts/ensure-electron*"
              - "scripts/electron-download*"
              - "scripts/verify-desktop-package*"
            assets:
              - "Raw Assets/**"
              - "scripts/assets/**"
              - "scripts/prepare-assets.mjs"
              - "scripts/check-prepared-assets.mjs"
              - "scripts/optimize-assets.mjs"
              - "scripts/optimize-sounds.mjs"
              - "scripts/optimize-music.mjs"
              - "scripts/sync-generated.mjs"
              - "scripts/sync-art-barrels.mjs"
              - "scripts/lib/asset-manifest-cache.mjs"
              - "scripts/lib/audio-optimizer.mjs"
              - "src/assets/optimized/**"
              - "public/sounds/**"
              - "public/Music/**"
              - "src/lib/game-data/assets.generated.ts"
              - "src/lib/game-data/gear-art.ts"
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup

      - name: Static checks
        run: npm run lint:ci

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - run: mkdir -p reports
      - name: Unit tests
        run: npx vitest run --reporter=github-actions --reporter=json --outputFile=reports/vitest-timings.json

      - name: Summarize unit tests
        if: always()
        run: node scripts/ci-summarize-vitest.mjs

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vitest-timings
          path: |
            reports/vitest-timings.json
            reports/current-run.*
            reports/runs/
          retention-days: 7
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - run: npm run build

      - name: Check bundle budget (index 600k / total 1.55M)
        run: node scripts/check-bundle-budget.mjs

      - name: Smoke test production build
        run: npm run smoke:preview

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/
            !dist/Music/
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - run: mkdir -p reports

      - name: Run critical e2e tests (shard ${{ matrix.shard }}/3)
        run: npm run test:e2e:critical -- --shard=${{ matrix.shard }}/3
        env:
          PLAYWRIGHT_VITE_MODE: preview
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/playwright-results-${{ matrix.shard }}.json

      - name: Summarize e2e tests
        if: always()
        run: node scripts/ci-summarize-playwright.mjs reports/playwright-results-${{ matrix.shard }}.json

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-critical-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            reports/playwright-results-${{ matrix.shard }}.json
            reports/current-run.*
            reports/runs/
          retention-days: 7

  ship-gate:
    needs: [changes, test]
    # Only produces the dist-desktop artifact consumed by electron-e2e, so it is
    # path-gated on the same electron filter rather than running on every push.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop_renderer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - name: Build desktop renderer
        run: npm run build:desktop

      - uses: actions/upload-artifact@v7
        with:
          name: dist-desktop
          path: |
            dist/
            !dist/Music/
          retention-days: 1

  assets:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.assets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
      - name: Assert committed outputs match preparation
        run: npm run assets:check

  # Save persistence remains path-gated because it intentionally exercises the complete save journeys.
  save-gate:
    needs: [changes, build]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.save == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: ./.github/actions/setup-playwright
        with:
          install-deps: "false"

      - run: mkdir -p reports
      - name: Run complete save journeys
        run: npm run test:ship:e2e
        env:
          PLAYWRIGHT_VITE_MODE: preview

      - name: Summarize save journeys
        if: always()
        run: node scripts/ci-summarize-playwright.mjs

      - name: Upload save failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-save-gate
          path: |
            playwright-report/
            test-results/
            reports/playwright-results.json
            reports/current-run.*
            reports/runs/
          retention-days: 7

  desktop-build:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - name: Build Windows installer
        run: npm run dist:desktop

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-desktop-win
          path: release-desktop/
          retention-days: 3

  electron-e2e:
    needs: [changes, ship-gate]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop_renderer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
        with:
          skip-electron-download: "true"

      - uses: actions/download-artifact@v8
        with:
          name: dist-desktop
          path: dist/

      - name: Cache Electron binary
        uses: actions/cache@v6
        id: electron-binary-cache
        with:
          path: |
            ~/.cache/electron
            node_modules/electron/dist
            node_modules/electron/path.txt
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Ensure Electron binary
        run: node scripts/ensure-electron.mjs

      - run: mkdir -p reports

      - name: Run Electron e2e
        run: xvfb-run --auto-servernum -- npm run test:ship:desktop
        env:
          CI: true

      - name: Summarize Electron e2e
        if: always()
        run: node scripts/ci-summarize-playwright.mjs reports/playwright-electron-results.json

      - name: Upload Electron Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-electron
          path: |
            playwright-report/
            test-results/
            reports/playwright-electron-results.json
            reports/current-run.*
            reports/runs/
          retention-days: 7

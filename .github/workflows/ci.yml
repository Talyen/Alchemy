name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      save: ${{ steps.filter.outputs.save }}
      desktop: ${{ steps.filter.outputs.desktop }}
      electron: ${{ steps.filter.outputs.electron }}
      assets: ${{ steps.filter.outputs.assets }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      # workflow_dispatch has no diff base; gated jobs run unconditionally there.
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            save:
              - "src/lib/validation/**"
              - "src/features/alchemy/shared/storage/**"
              - "src/lib/active-run-session/**"
              - "src/lib/platform.ts"
              - "src/features/alchemy/shared/stores/run-transitions*"
              - "src/features/alchemy/shared/stores/run-domain-store*"
              - "src/features/alchemy/shell/use-alchemy-run-controller*"
              - "tests/fixtures/legacy-saves*"
              - "tests/e2e/mid-combat-save*"
              - "tests/save-*"
            desktop:
              - "desktop/**"
              - "index.html"
              - "src/main.tsx"
              - "src/lib/platform.ts"
              - "src/lib/crash-reporting.ts"
              - "src/features/alchemy/shared/storage/**"
              - "vite.config.ts"
              - "package.json"
              - "steam/**"
              - "scripts/dist-desktop*"
              - "scripts/verify-desktop-package*"
              - "scripts/sync-steam-appid*"
            electron:
              - "desktop/**"
              - "index.html"
              - "src/main.tsx"
              - "src/lib/platform.ts"
              - "src/lib/crash-reporting.ts"
              - "src/features/alchemy/shared/storage/**"
              - "tests/electron-*"
              - "playwright.electron*"
              - "package.json"
              - "scripts/electron-path*"
              - "scripts/ensure-electron*"
              - "scripts/electron-download*"
              - "scripts/verify-desktop-package*"
            assets:
              - "Raw Assets/**"
              - "scripts/assets/**"
              - "scripts/prepare-assets.mjs"
              - "scripts/optimize-assets.mjs"
              - "scripts/optimize-sounds.mjs"
              - "scripts/optimize-music.mjs"
              - "scripts/sync-assets.mjs"
              - "scripts/sync-gear-art.mjs"
              - "scripts/lib/asset-manifest-cache.mjs"
              - "src/assets/optimized/**"
              - "public/sounds/**"
              - "public/Music/**"
              - "src/lib/game-data/assets.generated.ts"
              - "src/lib/game-data/gear-art.ts"
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.sha }} --verbose

      # Split lint:ci so the failed step name identifies the failure class.
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck:all
      - name: ESLint
        run: npm run lint
      - name: Import boundaries
        run: npm run lint:boundaries
      - name: Dead code (knip)
        run: npm run deadcode

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - run: mkdir -p reports
      - name: Unit tests
        run: npx vitest run --reporter=github-actions --reporter=json --outputFile=reports/vitest-timings.json

      - name: Summarize unit tests
        if: always()
        run: node scripts/ci-summarize-vitest.mjs

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: vitest-timings
          path: reports/vitest-timings.json
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - run: npm run build
        env:
          ALCHEMY_SKIP_ASSETS: "1"

      - name: Smoke test production build
        run: npm run smoke:preview

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: |
            dist/
            !dist/Music/
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - run: mkdir -p reports

      - name: Run critical e2e tests
        run: npm run test:e2e:prepush:full
        env:
          PLAYWRIGHT_VITE_MODE: preview

      - name: Summarize e2e tests
        if: always()
        run: node scripts/ci-summarize-playwright.mjs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-critical
          path: |
            playwright-report/
            test-results/
            reports/playwright-results.json
          retention-days: 3

  ship-gate:
    needs: [changes, test]
    # Only produces the dist-desktop artifact consumed by electron-e2e, so it is
    # path-gated on the same electron filter rather than running on every push.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.electron == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - name: Build desktop renderer
        run: npm run build:desktop
        env:
          ALCHEMY_SKIP_ASSETS: "1"

      - uses: actions/upload-artifact@v5
        with:
          name: dist-desktop
          path: |
            dist/
            !dist/Music/
          retention-days: 1

  assets:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.assets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
      - name: Prepare assets from Raw Assets
        run: node scripts/prepare-assets.mjs

      - name: Assert committed outputs match prep
        run: |
          git diff --exit-code -- \
            src/assets/optimized \
            public/sounds \
            public/Music \
            src/lib/game-data/assets.generated.ts \
            src/lib/game-data/gear-art.ts

  save-gate:
    needs: [changes, build]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.save == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright
        with:
          install-deps: "false"

      - run: mkdir -p reports

      - name: Run save persistence e2e
        run: npm run test:ship:e2e
        env:
          PLAYWRIGHT_VITE_MODE: preview

      - name: Summarize save e2e
        if: always()
        run: node scripts/ci-summarize-playwright.mjs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-save-gate
          path: |
            playwright-report/
            test-results/
            reports/playwright-results.json
          retention-days: 3

  desktop-build:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - name: Build Windows installer
        run: npm run dist:desktop
        env:
          ALCHEMY_SKIP_ASSETS: "1"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-desktop-win
          path: release-desktop/
          retention-days: 3

  electron-e2e:
    needs: [changes, ship-gate]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.electron == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
        with:
          skip-electron-download: "true"

      - uses: actions/download-artifact@v8
        with:
          name: dist-desktop
          path: dist/

      - name: Cache Electron binary
        uses: actions/cache@v5
        id: electron-binary-cache
        with:
          path: |
            ~/.cache/electron
            node_modules/electron/dist
            node_modules/electron/path.txt
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Ensure Electron binary
        run: node scripts/ensure-electron.mjs

      - run: mkdir -p reports

      - name: Run Electron e2e
        run: xvfb-run --auto-servernum -- npm run test:ship:desktop
        env:
          CI: true

      - name: Summarize Electron e2e
        if: always()
        run: node scripts/ci-summarize-playwright.mjs

  # Aggregate status check for dashboards / optional PR merges (not a main push gate).
  ci-ok:
    name: CI OK
    needs: [changes, lint, test, build, e2e, ship-gate, assets, save-gate, desktop-build, electron-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required job failed or was cancelled."
              exit 1
            fi
          done

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      desktop_renderer: ${{ steps.filter.outputs.desktop_renderer }}
      assets: ${{ steps.filter.outputs.assets }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
          sparse-checkout-cone-mode: false

      # workflow_dispatch has no diff base; gated jobs run unconditionally there.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            desktop:
              - ".node-version"
              - ".npmrc"
              - "game-edition.mjs"
              - "scripts/build-verified.mjs"
              - "scripts/check-bundle-budget.mjs"
              - "scripts/lib/verification/bundle-budget.mjs"
              - "scripts/lib/storage-footprint*"
              - "scripts/lib/command-invocation.mjs"
              - "scripts/lib/run-command.mjs"
              - "scripts/lib/script-run.mjs"
              - "scripts/lib/repo-package.mjs"
              - "scripts/lib/is-main-module.mjs"
              - "scripts/lib/repository-paths.mjs"
              - "scripts/lib/vite-*.mjs"
              - "scripts/lib/release/sentry-release.mjs"
              - "scripts/lib/release/desktop-build-config.mjs"
              - ".github/**"
              - "package.json"
              - "package-lock.json"
              - "desktop/**"
              - "index.html"
              - "public/startup-*.js"
              - "src/main.tsx"
              - "src/lib/localization/**"
              - "scripts/localization*"
              - "scripts/localization/**"
              - "src/lib/platform.ts"
              - "src/lib/desktop-api.ts"
              - "src/lib/settings-values.ts"
              - "src/lib/crash-reporting.ts"
              - "src/features/alchemy/shared/storage/**"
              - "vite.config.ts"
              - "tsconfig*.json"
              - "steam/**"
              - "scripts/ensure-steamworks*"
              - "scripts/steamworks/*.patch"
              - "scripts/dist-desktop*"
              - "scripts/lib/release/desktop-artifact*"
              - "scripts/lib/release/game-edition.mjs"
              - "scripts/verify-desktop-package*"
              - "scripts/lib/release/release-checks.mjs"
              - "scripts/smoke-desktop*"
              - "scripts/sync-steam-appid*"
            desktop_renderer:
              - ".node-version"
              - ".npmrc"
              - "game-edition.mjs"
              - "scripts/build-verified.mjs"
              - "scripts/check-bundle-budget.mjs"
              - "scripts/lib/verification/bundle-budget.mjs"
              - "scripts/lib/storage-footprint*"
              - "scripts/lib/command-invocation.mjs"
              - "scripts/lib/run-command.mjs"
              - "scripts/lib/script-run.mjs"
              - "scripts/lib/repo-package.mjs"
              - "scripts/lib/is-main-module.mjs"
              - "scripts/lib/repository-paths.mjs"
              - "scripts/lib/vite-*.mjs"
              - "scripts/lib/release/sentry-release.mjs"
              - "scripts/lib/release/desktop-build-config.mjs"
              - ".github/**"
              - "package.json"
              - "package-lock.json"
              - "desktop/**"
              - "index.html"
              - "public/startup-*.js"
              - "src/main.tsx"
              - "src/App.tsx"
              - "src/app/**"
              - "src/lib/localization/**"
              - "scripts/localization*"
              - "scripts/localization/**"
              - "src/lib/platform.ts"
              - "src/lib/desktop-api.ts"
              - "src/lib/settings-values.ts"
              - "src/lib/crash-reporting.ts"
              - "src/lib/routing/**"
              - "src/features/alchemy/shell/**"
              - "src/features/alchemy/shared/storage/**"
              - "src/features/alchemy/shared/stores/**"
              - "src/features/alchemy/meta/screens/**"
              - "src/features/alchemy/run-setup/screens/**"
              - "src/features/alchemy/run-loop/screens/**"
              - "tests/interaction/**"
              - "tests/pages/**"
              - "tests/e2e/**"
              - "tests/fixtures/**"
              - "tests/browser-helpers.ts"
              - "src/features/alchemy/run-loop/battle/**"
              - "src/features/alchemy/run-loop/navigation/**"
              - "src/features/alchemy/run-loop/run/**"
              - "src/features/alchemy/run-loop/shop/**"
              - "src/features/alchemy/run-setup/run/**"
              - "src/features/alchemy/meta/talents/**"
              - "src/features/alchemy/shared/ui/**"
              - "src/lib/animation/**"
              - "src/lib/battle/**"
              - "src/lib/preload/image.ts"
              - "src/lib/platform-save-backend.ts"
              - "tests/electron/**"
              - "playwright.electron*"
              - "vite.config.ts"
              - "tsconfig*.json"
              - "scripts/prepare-assets.mjs"
              - "scripts/electron-path*"
              - "scripts/ensure-electron*"
              - "scripts/electron-download*"
              - "scripts/verify-desktop-package*"
              - "scripts/lib/release/desktop-artifact*"
              - "scripts/lib/release/game-edition.mjs"
              - "scripts/lib/release/release-checks.mjs"
              - "scripts/smoke-desktop*"
            assets:
              - "assets/sources/**"
              - ".node-version"
              - ".npmrc"
              - ".github/**"
              - "package.json"
              - "package-lock.json"
              - "scripts/assets/**"
              - "scripts/prepare-assets.mjs"
              - "scripts/check-prepared-assets.mjs"
              - "scripts/generate-icons.mjs"
              - "desktop/icons/**"
              - "scripts/optimize-assets.mjs"
              - "scripts/optimize-sounds.mjs"
              - "scripts/optimize-music.mjs"
              - "scripts/optimize-boss-idles.mjs"
              - "scripts/sync-generated.mjs"
              - "scripts/sync-art-barrels.mjs"
              - "scripts/assets.mjs"
              - "scripts/lib/process-helpers.mjs"
              - "scripts/lib/cli-args.mjs"
              - "scripts/lib/is-main-module.mjs"
              - "scripts/lib/map-pool.mjs"
              - "scripts/lib/repo-package.mjs"
              - "scripts/lib/script-run.mjs"
              - "scripts/lib/write-text-if-changed.mjs"
              - "src/assets/optimized/**"
              - "src/assets/boss-idles/**"
              - "public/sounds/**"
              - "public/favicon*"
              - "public/icon-*"
              - "public/apple-touch-icon.png"
              - "public/site.webmanifest"
              - "public/Music/**"
              - "src/lib/game-data/assets.generated.ts"
              - "src/lib/game-data/gear-art.generated.ts"
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup

      # Reuse compiler analysis, never a pass/fail result: static checks always run.
      - name: Cache incremental TypeScript state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/tsbuild/
          key: tsbuild-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'package-lock.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            tsbuild-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'package-lock.json', 'tsconfig*.json') }}-

      - name: Static checks
        run: npm run lint:ci

      - name: Retain static failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: static-diagnostics
          path: |
            reports/current-run.*
            reports/runs/
          retention-days: 1
          if-no-files-found: warn

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - run: mkdir -p reports
      - name: Unit tests
        run: npx vitest run --reporter=github-actions --reporter=json --outputFile=reports/vitest-timings.json

      - name: Summarize unit tests
        if: always()
        run: node scripts/ci-summarize.mjs --vitest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: vitest-timings
          path: |
            reports/vitest-timings.json
            reports/current-run.*
            reports/runs/
          retention-days: 1
          if-no-files-found: ignore

  build:
    uses: ./.github/workflows/web-build.yml
    with:
      diagnostics: build-diagnostics-ci-build

  e2e:
    needs: build
    uses: ./.github/workflows/web-e2e.yml
    with:
      command: npm run test:e2e:critical
      artifact: playwright-report-critical

  localization:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record test job setup start
        run: echo "ALCHEMY_CI_SETUP_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: ./.github/actions/setup-playwright
      - name: Run representative localization acceptance
        run: npm run test:e2e -- tests/e2e/specs/localization.spec.ts tests/e2e/specs/localization-gameplay.spec.ts --grep @localization-smoke
        env:
          CI: true
          ALCHEMY_LOCALIZATION_LAYOUT_REVIEW: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/playwright-localization-results.json
      - name: Summarize localization acceptance
        id: playwright-summary
        if: always()
        run: node scripts/ci-summarize.mjs --playwright reports/playwright-localization-results.json
      - name: Upload localization results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-localization-results
          path: reports/playwright-localization-results.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload localization diagnostics
        if: failure() || steps.playwright-summary.outputs.retain-diagnostics == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-localization-diagnostics
          path: |
            playwright-report/
            test-results/
            reports/current-run.*
            reports/runs/
          retention-days: 1

  localization-demo:
    uses: ./.github/workflows/demo-e2e.yml
    with:
      artifact: localization-demo-diagnostics

  ship-gate:
    needs: changes
    # Produces the complete renderer for Electron tests and Windows packaging.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop_renderer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            /*
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - name: Build desktop renderer
        run: npm run build:desktop

      - name: Check desktop bundle budget
        run: npm run check:bundle

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-desktop
          path: dist/
          compression-level: 0
          retention-days: 1

      - name: Retain build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-diagnostics-ci-ship-gate
          path: |
            reports/compact/
            reports/current-run.*
            reports/runs/
          retention-days: 1
          if-no-files-found: ignore

  assets:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.assets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: ./.github/actions/setup
      - name: Assert repository sources and committed outputs match preparation
        run: npm run assets:check

  desktop-build:
    needs: [changes, ship-gate]
    # Reuses ship-gate's desktop renderer bundle when it already built one
    # instead of paying for a second full Vite build; a failed renderer build
    # fails this job instead of repackaging a known-bad bundle.
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop == 'true') &&
      (needs.ship-gate.result == 'success' || needs.ship-gate.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            /*
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
        with:
          native-steamworks: "true"

      - name: Cache Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/electron
            node_modules/electron/dist
            node_modules/electron/path.txt
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Electron binary
        run: npm run ensure:electron

      - name: Sync Steam App ID
        run: npm run sync:steam-appid

      - name: Reuse desktop renderer bundle
        id: renderer-download
        if: needs.ship-gate.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-desktop
          path: dist/

      - name: Build desktop renderer
        if: steps.renderer-download.outcome != 'success'
        run: npm run build:desktop

      - name: Check fallback desktop bundle budget
        if: steps.renderer-download.outcome != 'success'
        run: npm run check:bundle

      - name: Package Windows installer
        run: node scripts/dist-desktop.mjs

      - name: Smoke test packaged Windows game
        timeout-minutes: 2
        run: npm run smoke:desktop

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-desktop-win
          path: release-desktop/
          retention-days: 3

      - name: Retain package size measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-storage-ci
          path: reports/storage/
          retention-days: 7
          if-no-files-found: error

      - name: Retain build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-diagnostics-ci-desktop-build
          path: |
            reports/compact/
            reports/current-run.*
            reports/runs/
          retention-days: 1
          if-no-files-found: ignore

  electron-e2e:
    needs:
      - changes
      - ship-gate
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop_renderer == 'true'
    uses: ./.github/workflows/electron-e2e.yml
    with:
      artifact: playwright-report-electron

  visual:
    name: Player screen visual regression
    needs: build
    # Match the committed Darwin baselines; Linux/Windows text rasterization differs.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: ./.github/actions/setup-playwright
        with:
          install-deps: "false"
      - run: npm run test:visual
      - name: Retain visual differences
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: player-screen-visual-diffs
          path: |
            test-results/
            playwright-report/
            reports/
          retention-days: 7

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install -g npm@10

      - run: npm ci

      - if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.sha }} --verbose

      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Smoke test production build
        run: |
          npx vite preview --host 127.0.0.1 --port 4174 --strictPort &
          sleep 3
          curl -sf http://127.0.0.1:4174 > /dev/null
          kill %1

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:critical

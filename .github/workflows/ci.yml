name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11 && npm ci --prefer-offline

  lint:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11 && npm ci --prefer-offline
      - if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.sha }} --verbose

      # Split lint:ci so the failed step name identifies the failure class.
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck:all
      - name: ESLint
        run: npm run lint
      - name: Import boundaries
        run: npm run lint:boundaries
      - name: Architecture ESLint smoke
        run: npm run lint:architecture-smoke
      - name: Dead code (knip)
        run: npm run deadcode

  test:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11 && npm ci --prefer-offline
      - run: mkdir -p reports
      - name: Unit tests
        run: npx vitest run --reporter=github-actions --reporter=json --outputFile=reports/vitest-timings.json

      - name: Summarize unit tests
        if: always()
        run: node scripts/ci-summarize-vitest.mjs

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: vitest-timings
          path: reports/vitest-timings.json
          if-no-files-found: ignore

  build:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11 && npm ci --prefer-offline
      - name: Cache optimized assets
        uses: actions/cache@v5
        id: asset-cache
        with:
          path: src/assets/optimized/
          key: assets-${{ runner.os }}-${{ hashFiles('src/assets/**', 'Raw Assets/**', 'scripts/optimize-assets.mjs', 'scripts/optimize-sounds.mjs', 'scripts/optimize-music.mjs', 'scripts/sync-gear-art.mjs') }}

      - run: npm run build

      - name: Smoke test production build
        run: |
          npx vite preview --host 127.0.0.1 --port 4174 --strictPort &
          preview_pid=$!
          npx wait-on http://127.0.0.1:4174 --timeout 30000
          curl -sf http://127.0.0.1:4174 > /dev/null
          kill "$preview_pid"

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: |
            dist/
            !dist/Music/
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11 && npm ci --prefer-offline
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium (with system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: npx playwright install chromium

      - name: Playwright install diagnostics
        if: failure()
        run: |
          npx playwright install --dry-run || true
          ls -la ~/.cache/ms-playwright || true

      - run: mkdir -p reports

      - name: Run critical e2e tests
        run: npm run test:e2e:critical
        env:
          PLAYWRIGHT_VITE_MODE: preview

      - name: Summarize e2e tests
        if: always()
        run: node scripts/ci-summarize-playwright.mjs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-critical
          path: |
            playwright-report/
            test-results/
            reports/playwright-results.json
          retention-days: 3

  ship-gate:
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11 && npm ci --prefer-offline
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - run: node scripts/sync-version-metadata.mjs
      - run: npm run check:ship:ci

  save-gate:
    needs: [install, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11 && npm ci --prefer-offline
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Detect save-related changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          else
            FILES=$(git diff --name-only HEAD~1 HEAD || true)
          fi
          echo "$FILES"
          if echo "$FILES" | grep -Eq '^(src/lib/validation/|src/features/alchemy/shared/storage/|src/lib/active-run-session/|src/lib/platform.ts|tests/fixtures/legacy-saves|tests/e2e/mid-combat-save|tests/save-)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Playwright browsers
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.changes.outputs.run == 'true'
        run: npx playwright install chromium

      - name: Prepare reports dir
        if: steps.changes.outputs.run == 'true'
        run: mkdir -p reports

      - name: Run save persistence e2e
        if: steps.changes.outputs.run == 'true'
        run: npm run test:ship:e2e
        env:
          PLAYWRIGHT_VITE_MODE: preview

      - name: Summarize save e2e
        if: always() && steps.changes.outputs.run == 'true'
        run: node scripts/ci-summarize-playwright.mjs

  active-run-gate:
    needs: [install, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11 && npm ci --prefer-offline
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Detect active-run changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          else
            FILES=$(git diff --name-only HEAD~1 HEAD || true)
          fi
          if echo "$FILES" | grep -Eq '^(src/lib/active-run-session/|src/features/alchemy/shared/stores/run-transitions|src/features/alchemy/shared/stores/run-domain-store|src/features/alchemy/shell/use-alchemy-run-controller|src/lib/validation/save-schemas/active-run|tests/save-mid-combat|tests/e2e/mid-combat-save)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Playwright browsers
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.changes.outputs.run == 'true'
        run: npx playwright install chromium

      - name: Prepare reports dir
        if: steps.changes.outputs.run == 'true'
        run: mkdir -p reports

      - name: Run mid-combat resume e2e
        if: steps.changes.outputs.run == 'true'
        run: npx playwright test tests/save-mid-combat-resume.spec.ts --project chromium
        env:
          PLAYWRIGHT_VITE_MODE: preview

      - name: Summarize mid-combat e2e
        if: always() && steps.changes.outputs.run == 'true'
        run: node scripts/ci-summarize-playwright.mjs

  desktop-build:
    needs: install
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11 && npm ci --prefer-offline
      - name: Detect desktop changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          else
            FILES=$(git diff --name-only HEAD~1 HEAD || true)
          fi
          if echo "$FILES" | grep -Eq '^(desktop/|src/lib/platform.ts|src/features/alchemy/shared/storage/|vite.config.ts|package.json|steam/|scripts/dist-desktop|scripts/sync-steam-appid)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Windows installer
        if: steps.changes.outputs.run == 'true'
        run: npm run dist:win

      - name: Upload desktop artifact
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: release-desktop-win
          path: release-desktop/
          retention-days: 3

  electron-e2e:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm install -g npm@11 && npm ci --prefer-offline

      - name: Detect desktop changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          else
            FILES=$(git diff --name-only HEAD~1 HEAD || true)
          fi
          if echo "$FILES" | grep -Eq '^(desktop/|src/lib/platform.ts|src/features/alchemy/shared/storage/|tests/electron-|playwright.electron|package.json)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache/restore@v5
        if: steps.changes.outputs.run == 'true'
        id: electron-binary-cache
        with:
          path: |
            ~/.cache/electron
            node_modules/electron/dist
            node_modules/electron/path.txt
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Ensure Electron binary
        if: steps.changes.outputs.run == 'true'
        run: node scripts/ensure-electron.mjs

      - name: Compile desktop renderer
        if: steps.changes.outputs.run == 'true'
        run: npm run compile:desktop

      - name: Prepare reports dir
        if: steps.changes.outputs.run == 'true'
        run: mkdir -p reports

      - name: Run Electron e2e
        if: steps.changes.outputs.run == 'true'
        run: xvfb-run --auto-servernum -- npm run test:ship:desktop
        env:
          CI: true

      - name: Summarize Electron e2e
        if: always() && steps.changes.outputs.run == 'true'
        run: node scripts/ci-summarize-playwright.mjs

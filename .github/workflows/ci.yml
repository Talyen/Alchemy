name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      save: ${{ steps.filter.outputs.save }}
      desktop: ${{ steps.filter.outputs.desktop }}
      desktop_renderer: ${{ steps.filter.outputs.desktop_renderer }}
      assets: ${{ steps.filter.outputs.assets }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      # workflow_dispatch has no diff base; gated jobs run unconditionally there.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            save:
              - ".github/**"
              - "package.json"
              - "package-lock.json"
              - "src/lib/validation/**"
              - "src/lib/content-validation/**"
              - "src/features/alchemy/shared/storage/**"
              - "src/lib/active-run-session/**"
              - "src/lib/platform.ts"
              - "src/lib/platform-save-backend.ts"
              - "src/features/alchemy/shared/stores/**"
              - "src/app/use-app-save-state.ts"
              - "src/app/use-alchemy-bootstrap.ts"
              - "src/features/alchemy/shell/use-alchemy-run-controller*"
              - "tests/fixtures/legacy-saves*"
              - "tests/e2e/mid-combat-save*"
              - "tests/e2e/specs/save-*"
            desktop:
              - "scripts/build-verified.mjs"
              - "scripts/lib/vite-*.mjs"
              - "scripts/lib/sentry-release.mjs"
              - "scripts/lib/desktop-build-config.mjs"
              - ".github/**"
              - "package.json"
              - "package-lock.json"
              - "desktop/**"
              - "index.html"
              - "src/main.tsx"
              - "src/lib/platform.ts"
              - "src/lib/desktop-api.ts"
              - "src/lib/settings-values.ts"
              - "src/lib/crash-reporting.ts"
              - "src/features/alchemy/shared/storage/**"
              - "vite.config.ts"
              - "tsconfig*.json"
              - "steam/**"
              - "scripts/dist-desktop*"
              - "scripts/lib/desktop-artifact*"
              - "scripts/verify-desktop-package*"
              - "scripts/lib/release-checks.mjs"
              - "scripts/smoke-desktop*"
              - "scripts/sync-steam-appid*"
            desktop_renderer:
              - "scripts/build-verified.mjs"
              - "scripts/lib/vite-*.mjs"
              - "scripts/lib/sentry-release.mjs"
              - "scripts/lib/desktop-build-config.mjs"
              - ".github/**"
              - "package.json"
              - "package-lock.json"
              - "desktop/**"
              - "index.html"
              - "src/main.tsx"
              - "src/App.tsx"
              - "src/app/**"
              - "src/lib/platform.ts"
              - "src/lib/desktop-api.ts"
              - "src/lib/settings-values.ts"
              - "src/lib/crash-reporting.ts"
              - "src/lib/routing/**"
              - "src/features/alchemy/shell/**"
              - "src/features/alchemy/shared/storage/**"
              - "src/features/alchemy/shared/stores/**"
              - "src/features/alchemy/meta/screens/**"
              - "src/features/alchemy/run-setup/screens/**"
              - "src/features/alchemy/run-loop/screens/**"
              - "tests/electron/**"
              - "playwright.electron*"
              - "vite.config.ts"
              - "tsconfig*.json"
              - "scripts/prepare-assets.mjs"
              - "scripts/electron-path*"
              - "scripts/ensure-electron*"
              - "scripts/electron-download*"
              - "scripts/verify-desktop-package*"
              - "scripts/lib/release-checks.mjs"
              - "scripts/smoke-desktop*"
            assets:
              - ".github/**"
              - "package.json"
              - "package-lock.json"
              - "Raw Assets/**"
              - "scripts/assets/**"
              - "scripts/prepare-assets.mjs"
              - "scripts/check-prepared-assets.mjs"
              - "scripts/optimize-assets.mjs"
              - "scripts/optimize-sounds.mjs"
              - "scripts/optimize-music.mjs"
              - "scripts/sync-generated.mjs"
              - "scripts/sync-art-barrels.mjs"
              - "scripts/assets.mjs"
              - "scripts/optimize-pipelines.mjs"
              - "scripts/lib/*asset*.mjs"
              - "scripts/lib/registry-validation.mjs"
              - "scripts/lib/process-helpers.mjs"
              - "scripts/lib/audio-optimizer.mjs"
              - "src/assets/optimized/**"
              - "public/sounds/**"
              - "public/Music/**"
              - "src/lib/game-data/assets.generated.ts"
              - "src/lib/game-data/gear-art.ts"
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup

      - name: Static checks
        run: npm run lint:ci

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - run: mkdir -p reports
      - name: Unit tests
        run: npx vitest run --reporter=github-actions --reporter=json --outputFile=reports/vitest-timings.json

      - name: Summarize unit tests
        if: always()
        run: node scripts/ci-summarize.mjs --vitest

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vitest-timings
          path: |
            reports/vitest-timings.json
            reports/current-run.*
            reports/runs/
          retention-days: 7
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - run: npm run build

      - name: Check bundle budget
        run: node scripts/check-bundle-budget.mjs

      - name: Smoke test production build
        run: npm run smoke:preview

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          compression-level: 0
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALCHEMY_RUN_VARIANT: shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Smoke test downloaded build including music
        run: npm run smoke:preview

      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - run: mkdir -p reports

      - name: Run critical e2e tests (shard ${{ matrix.shard }}/3)
        run: npm run test:e2e:critical -- --shard=${{ matrix.shard }}/3
        env:
          PLAYWRIGHT_VITE_MODE: preview
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/playwright-results-${{ matrix.shard }}.json

      - name: Summarize e2e tests
        id: playwright-summary
        if: always()
        run: node scripts/ci-summarize.mjs --playwright reports/playwright-results-${{ matrix.shard }}.json

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-critical-${{ matrix.shard }}-results
          path: reports/playwright-results-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure() || steps.playwright-summary.outputs.retain-diagnostics == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-critical-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            reports/playwright-results-${{ matrix.shard }}.json
            reports/current-run.*
            reports/runs/
          retention-days: 7

  ship-gate:
    needs: changes
    # Produces the complete renderer for Electron tests and Windows packaging.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop_renderer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - name: Build desktop renderer
        run: npm run build:desktop

      - name: Check desktop bundle budget
        run: npm run check:bundle

      - uses: actions/upload-artifact@v7
        with:
          name: dist-desktop
          path: dist/
          compression-level: 0
          retention-days: 1

  assets:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.assets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
      - name: Assert committed outputs match preparation
        run: npm run assets:check

  # Save persistence remains path-gated because it intentionally exercises the complete save journeys.
  save-gate:
    needs: [changes, build]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.save == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Smoke test downloaded build including music
        run: npm run smoke:preview

      - uses: ./.github/actions/setup-playwright

      - run: mkdir -p reports
      - name: Run complete save journeys
        run: npm run test:ship:e2e
        env:
          PLAYWRIGHT_VITE_MODE: preview

      - name: Summarize save journeys
        id: playwright-summary
        if: always()
        run: node scripts/ci-summarize.mjs --playwright

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-save-gate-results
          path: reports/playwright-results.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload save failure report
        if: failure() || steps.playwright-summary.outputs.retain-diagnostics == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-save-gate
          path: |
            playwright-report/
            test-results/
            reports/playwright-results.json
            reports/current-run.*
            reports/runs/
          retention-days: 7
          if-no-files-found: ignore

  desktop-build:
    needs: [changes, ship-gate]
    # Reuses ship-gate's desktop renderer bundle when it already built one
    # instead of paying for a second full Vite build; a failed renderer build
    # fails this job instead of repackaging a known-bad bundle.
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop == 'true') &&
      (needs.ship-gate.result == 'success' || needs.ship-gate.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup

      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            node_modules/electron/dist
            node_modules/electron/path.txt
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Electron binary
        run: npm run ensure:electron

      - name: Sync Steam App ID
        run: npm run sync:steam-appid

      - name: Reuse desktop renderer bundle
        id: renderer-download
        if: needs.ship-gate.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: dist-desktop
          path: dist/
          compression-level: 0

      - name: Build desktop renderer
        if: steps.renderer-download.outcome != 'success'
        run: npm run build:desktop

      - name: Check fallback desktop bundle budget
        if: steps.renderer-download.outcome != 'success'
        run: npm run check:bundle

      - name: Package Windows installer
        run: node scripts/dist-desktop.mjs

      - name: Smoke test packaged Windows game
        timeout-minutes: 2
        run: npm run smoke:desktop

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-desktop-win
          path: release-desktop/
          retention-days: 3

  electron-e2e:
    needs: [changes, ship-gate]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop_renderer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: dist-desktop
          path: dist/
          compression-level: 0

      - name: Cache Electron binary
        uses: actions/cache@v6
        id: electron-binary-cache
        with:
          path: |
            ~/.cache/electron
            node_modules/electron/dist
            node_modules/electron/path.txt
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Electron binary
        run: node scripts/ensure-electron.mjs

      - run: mkdir -p reports

      - name: Run Electron e2e
        run: xvfb-run --auto-servernum -- npm run test:ship:desktop
        env:
          CI: true

      - name: Summarize Electron e2e
        id: playwright-summary
        if: always()
        run: node scripts/ci-summarize.mjs --playwright reports/playwright-electron-results.json

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-electron-results
          path: reports/playwright-electron-results.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Electron Playwright report
        if: failure() || steps.playwright-summary.outputs.retain-diagnostics == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-electron
          path: |
            playwright-report/
            test-results/
            reports/playwright-electron-results.json
            reports/current-run.*
            reports/runs/
          retention-days: 7

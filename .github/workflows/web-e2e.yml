name: Shared web-e2e
on:
  workflow_call:
    inputs:
      command:
        type: string
        required: true
      artifact:
        type: string
        required: true
      variant:
        type: string
        default: ""
      layout-review:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Record test job setup start
        run: echo "ALCHEMY_CI_SETUP_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            /*
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/
      - name: Smoke test downloaded build including music
        run: npm run smoke:preview
      - name: Setup Playwright Chromium
        uses: ./.github/actions/setup-playwright
      - run: mkdir -p reports
      - name: Run browser suite
        run: ${{ inputs.command }}
        env:
          PLAYWRIGHT_VITE_MODE: preview
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/playwright-results.json
          ALCHEMY_LOCALIZATION_LAYOUT_REVIEW: ${{ inputs.layout-review && '1' || '' }}
      - name: Summarize e2e tests
        id: playwright-summary
        if: always()
        run: node scripts/ci-summarize.mjs --playwright reports/playwright-results.json
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.artifact }}-results
          path: reports/playwright-results.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: failure() || steps.playwright-summary.outputs.retain-diagnostics == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.artifact }}
          path: |
            playwright-report/
            test-results/
            reports/playwright-results.json
            reports/current-run.*
            reports/runs/
          retention-days: 1
    env:
      ALCHEMY_RUN_VARIANT: ${{ inputs.variant }}

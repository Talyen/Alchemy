name: Shared release-package
on:
  workflow_call:
    inputs:
      edition:
        type: string
        default: full
    outputs:
      artifact-id:
        description: Verified package from this producer attempt; delivery retries reuse this exact artifact.
        value: ${{ jobs.package.outputs.artifact-id }}
permissions:
  contents: read
jobs:
  package:
    outputs:
      artifact-id: ${{ steps.package-upload.outputs.artifact-id }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/assets/sources/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup
        with:
          native-steamworks: "true"
      - name: Cache Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/electron
            node_modules/electron/dist
            node_modules/electron/path.txt
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Ensure Electron binary
        run: npm run ensure:electron
      - name: Verify release tag matches package.json
        run: node scripts/verify-release.mjs --skip-package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Generate patch notes
        run: node scripts/generate-patch-notes.mjs
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - name: Assert committed outputs match preparation
        run: npm run assets:check:outputs
      - name: Build desktop installers
        run: npm run dist:desktop
        env:
          CI_RELEASE: "true"
          STEAM_DEMO_APP_ID: ${{ secrets.STEAM_DEMO_APP_ID }}
          STEAM_DEMO_DEPOT_ID: ${{ secrets.STEAM_DEMO_DEPOT_ID }}
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          STEAM_DEPOT_ID: ${{ secrets.STEAM_DEPOT_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CODE_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_CODE_SIGNING_PUBLISHER_NAME }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CODE_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CODE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          REQUIRE_CODE_SIGNING: ${{ vars.REQUIRE_CODE_SIGNING }}
          ALCHEMY_EDITION: ${{ inputs.edition }}
      - name: Smoke test packaged Windows game
        run: npm run smoke:desktop
        env:
          ALCHEMY_EDITION: ${{ inputs.edition }}
      - name: Retain verified release package
        id: package-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-package${{ inputs.edition == 'demo' && '-demo' || '' }}-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            release-desktop${{ inputs.edition == 'demo' && '-demo' || '' }}/
            release-notes/${{ github.ref_name }}.md
            reports/storage/package-${{ inputs.edition }}.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Retain build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-diagnostics-release-package${{ inputs.edition == 'demo' && '-demo' || '' }}
          path: |
            reports/compact/
            reports/current-run.*
            reports/runs/
          retention-days: 1
          if-no-files-found: ignore

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - name: Commitlint since previous release tag
        shell: bash
        run: |
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | sed -n '2p')"
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          fi
          if [ -n "$PREV_TAG" ]; then
            npx commitlint --from "$PREV_TAG" --to HEAD --verbose
          else
            echo "No previous v* tag found; linting from repository root commit."
            ROOT_COMMIT="$(git rev-list --max-parents=0 HEAD | tail -1)"
            npx commitlint --from "$ROOT_COMMIT" --to HEAD --verbose
          fi

      - run: npm run lint:ci

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - run: mkdir -p reports
      - name: Unit tests
        run: npx vitest run --reporter=dot --reporter=json --outputFile=reports/vitest-timings.json

      - name: Summarize unit tests
        if: always()
        run: node scripts/ci-summarize-vitest.mjs

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vitest-timings
          path: |
            reports/vitest-timings.json
            reports/current-run.*
            reports/runs/
          retention-days: 7
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - run: npm run build

      - name: Smoke test production build
        run: npm run smoke:preview

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/
            !dist/Music/
          retention-days: 1

  e2e-full:
    needs: build
    name: E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALCHEMY_RUN_VARIANT: shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - run: mkdir -p reports

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium (with system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: npx playwright install chromium

      - name: Run full e2e shard
        run: npm run test:e2e:full -- --shard=${{ matrix.shard }}/3
        env:
          CI: true

      - name: Summarize e2e tests
        if: always()
        run: node scripts/ci-summarize-playwright.mjs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-release-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            reports/playwright-results.json
            reports/current-run.*
            reports/runs/
          retention-days: 7

  release:
    needs: [lint, test, e2e-full]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup

      - name: Verify release tag matches package.json
        run: node scripts/verify-release-version.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Generate patch notes
        run: node scripts/generate-patch-notes.mjs
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

      - name: Assert committed outputs match preparation
        run: npm run assets:check

      - name: Build desktop installers
        run: npm run dist:desktop
        env:
          CI_RELEASE: "true"
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CODE_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_CODE_SIGNING_PUBLISHER_NAME }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CODE_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CODE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          REQUIRE_CODE_SIGNING: ${{ vars.REQUIRE_CODE_SIGNING }}

      # windows-latest does not ship SteamCMD; pin a known setup action by version tag.
      - name: Install SteamCMD
        uses: CyberAndrii/setup-steamcmd@v1.3.0

      - name: Steam upload
        shell: bash
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          STEAM_DEPOT_ID: ${{ secrets.STEAM_DEPOT_ID }}
          ALLOW_STEAM_DRY_RUN: ${{ vars.ALLOW_STEAM_DRY_RUN }}
        run: |
          if [ -z "$STEAM_USERNAME" ] || [ -z "$STEAM_PASSWORD" ] || [ -z "$STEAM_APP_ID" ] || [ -z "$STEAM_DEPOT_ID" ]; then
            if [ "$ALLOW_STEAM_DRY_RUN" = "true" ]; then
              echo "Steam credentials not configured — ALLOW_STEAM_DRY_RUN=true, running dry-run validation"
              npm run steam:upload:dry-run
            else
              echo "::error::Steam credentials are not configured. Set the STEAM_* secrets, or set repository variable ALLOW_STEAM_DRY_RUN=true to release without a Steam upload."
              exit 1
            fi
          else
            node scripts/steam-upload.mjs
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            release-desktop/*.exe
            release-desktop/*.exe.blockmap
            release-notes/**
          body_path: release-notes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

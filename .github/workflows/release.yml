name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11 && npm ci --prefer-offline

  lint:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11 && npm ci --prefer-offline
      - run: npx commitlint --from $(git tag --list "v*" --sort=-v:refname | head -1) --to HEAD --verbose || true

      - run: npm run lint:ci

  test:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11 && npm ci --prefer-offline
      - run: mkdir -p reports
      - run: npx vitest run --reporter=default --reporter=json --outputFile=reports/vitest-timings.json

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: vitest-timings
          path: reports/vitest-timings.json
          if-no-files-found: ignore

  build:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11 && npm ci --prefer-offline
      - name: Cache optimized assets
        uses: actions/cache@v5
        id: asset-cache
        with:
          path: src/assets/optimized/
          key: assets-${{ runner.os }}-${{ hashFiles('src/assets/**', 'Raw Assets/**', 'scripts/optimize-assets.mjs', 'scripts/optimize-sounds.mjs', 'scripts/optimize-music.mjs', 'scripts/sync-gear-art.mjs') }}

      - name: Clear optimized assets (force rebuild on cache miss)
        if: steps.asset-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf src/assets/optimized/
          mkdir -p src/assets/optimized/

      - run: npm run build

      - name: Smoke test production build
        run: |
          npx vite preview --host 127.0.0.1 --port 4174 --strictPort &
          preview_pid=$!
          npx wait-on http://127.0.0.1:4174 --timeout 30000
          curl -sf http://127.0.0.1:4174 > /dev/null
          kill "$preview_pid"

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: |
            dist/
            !dist/Music/
          retention-days: 1

  e2e-full:
    needs: build
    name: E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11 && npm ci --prefer-offline
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium (with system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: npx playwright install chromium

      - name: Run full e2e shard
        run: npm run test:e2e:preview -- --shard=${{ matrix.shard }}/3
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-release-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3

  release:
    needs: [e2e-full]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11 && npm ci

      - name: Verify release tag matches package.json
        run: node scripts/verify-release-version.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Sync version metadata
        run: node scripts/sync-version-metadata.mjs

      - name: Sync Steam App ID file
        run: node scripts/sync-steam-appid.mjs
        env:
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}

      - name: Ship gate
        run: npm run check:ship

      - name: Generate patch notes
        run: node scripts/generate-patch-notes.mjs
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

      - name: Build desktop installers
        run: npm run dist:desktop
        env:
          CI_RELEASE: "true"
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}

      - name: Steam upload
        shell: bash
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          STEAM_DEPOT_ID: ${{ secrets.STEAM_DEPOT_ID }}
        run: |
          if [ -z "$STEAM_USERNAME" ] || [ -z "$STEAM_PASSWORD" ] || [ -z "$STEAM_APP_ID" ] || [ -z "$STEAM_DEPOT_ID" ]; then
            echo "Steam credentials not configured — running dry-run validation"
            npm run steam:upload:dry-run
          else
            node scripts/steam-upload.mjs
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-desktop/**
            release-notes/**
          body_path: release-notes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  localization-qa:
    uses: ./.github/workflows/localization-qa.yml

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - name: Commitlint since previous release tag
        shell: bash
        run: |
          PREV_TAG="$(node --input-type=module -e 'import { previousVersionTag } from "./scripts/lib/release/git-release.mjs"; console.log(previousVersionTag(process.cwd(), process.env.GITHUB_REF_NAME) ?? "")')"
          if [ -n "$PREV_TAG" ]; then
            npx commitlint --from "$PREV_TAG" --to HEAD --verbose
          else
            echo "No previous v* tag found; linting from repository root commit."
            ROOT_COMMIT="$(git rev-list --max-parents=0 HEAD | tail -1)"
            npx commitlint --from "$ROOT_COMMIT" --to HEAD --verbose
          fi

      - run: npm run lint:ci

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - run: mkdir -p reports
      - name: Unit tests
        run: npx vitest run --reporter=dot --reporter=json --outputFile=reports/vitest-timings.json

      - name: Summarize unit tests
        if: always()
        run: node scripts/ci-summarize.mjs --vitest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: vitest-timings
          path: |
            reports/vitest-timings.json
            reports/current-run.*
            reports/runs/
          retention-days: 1
          if-no-files-found: ignore

  build:
    uses: ./.github/workflows/web-build.yml
    with:
      diagnostics: build-diagnostics-release-build
      release: true

  e2e-full:
    name: E2E (${{ matrix.shard }}/3)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
    uses: ./.github/workflows/web-e2e.yml
    with:
      command: npm run test:e2e:full -- --shard=${{ matrix.shard }}/3
      artifact: playwright-report-release-${{ matrix.shard }}
      variant: shard-${{ matrix.shard }}
      layout-review: true

  demo-e2e:
    needs: [lint, test]
    uses: ./.github/workflows/demo-e2e.yml
    with:
      artifact: demo-e2e-diagnostics
      full: true

  package:
    needs:
      - lint
      - test
      - e2e-full
      - localization-qa
    uses: ./.github/workflows/release-package.yml
    secrets: inherit

  package-demo:
    needs:
      - lint
      - test
      - demo-e2e
    uses: ./.github/workflows/release-package.yml
    with:
      edition: demo
    secrets: inherit

  vercel-qa:
    # Deliberate web QA deploy: Vercel Git auto-deploys are disabled in
    # vercel.json, so release tags trigger the project's Deploy Hook instead.
    # Runs alongside Steam publishing; a Vercel outage never blocks shipping.
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Vercel QA deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL secret is not set; skipping Vercel QA deploy."
            exit 0
          fi
          curl --fail --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL"

  release:
    needs: [package, package-demo]
    # Tags share Steam credentials and upload targets; keep each delivery intact.
    concurrency:
      group: steam-publishing
      queue: max
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup

      # The producer's ID remains valid when only this failed job is retried.
      - name: Download verified release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          merge-multiple: true
          path: .

      - name: Download verified demo package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.package-demo.outputs.artifact-id }}
          merge-multiple: true
          path: .

      # windows-latest does not ship SteamCMD; pin a known setup action by version tag.
      - name: Install SteamCMD
        uses: CyberAndrii/setup-steamcmd@afc45f145b95c175c3a3862d3ca84756537d48e8 # v1.3.0

      - name: Steam upload
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          STEAM_DEPOT_ID: ${{ secrets.STEAM_DEPOT_ID }}
          ALLOW_STEAM_DRY_RUN: ${{ vars.ALLOW_STEAM_DRY_RUN }}
        run: node scripts/steam-upload.mjs

      - name: Upload verified demo candidate
        env:
          ALCHEMY_EDITION: demo
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          STEAM_DEMO_APP_ID: ${{ secrets.STEAM_DEMO_APP_ID }}
          STEAM_DEMO_DEPOT_ID: ${{ secrets.STEAM_DEMO_DEPOT_ID }}
          ALLOW_STEAM_DRY_RUN: ${{ vars.ALLOW_STEAM_DRY_RUN }}
        run: node scripts/steam-upload.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            release-desktop/*.exe
            release-desktop/*.exe.blockmap
            release-desktop-demo/*.exe
            release-desktop-demo/*.exe.blockmap
            release-notes/**
          body_path: release-notes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

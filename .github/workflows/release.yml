name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - name: Commitlint since previous release tag
        shell: bash
        run: |
          PREV_TAG="$(node --input-type=module -e 'import { previousVersionTag } from "./scripts/lib/git-release.mjs"; console.log(previousVersionTag(process.cwd(), process.env.GITHUB_REF_NAME) ?? "")')"
          if [ -n "$PREV_TAG" ]; then
            npx commitlint --from "$PREV_TAG" --to HEAD --verbose
          else
            echo "No previous v* tag found; linting from repository root commit."
            ROOT_COMMIT="$(git rev-list --max-parents=0 HEAD | tail -1)"
            npx commitlint --from "$ROOT_COMMIT" --to HEAD --verbose
          fi

      - run: npm run lint:ci

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - run: mkdir -p reports
      - name: Unit tests
        run: npx vitest run --reporter=dot --reporter=json --outputFile=reports/vitest-timings.json

      - name: Summarize unit tests
        if: always()
        run: node scripts/ci-summarize.mjs --vitest

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vitest-timings
          path: |
            reports/vitest-timings.json
            reports/current-run.*
            reports/runs/
          retention-days: 7
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - run: npm run build

      - run: npm run check:bundle

      - name: Smoke test production build
        run: npm run smoke:preview

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          compression-level: 0
          retention-days: 1

  e2e-full:
    needs: build
    name: E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALCHEMY_RUN_VARIANT: shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !Raw Assets
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Smoke test downloaded build including music
        run: npm run smoke:preview

      - run: mkdir -p reports

      - uses: ./.github/actions/setup-playwright

      - name: Run full e2e shard
        run: npm run test:e2e:full -- --shard=${{ matrix.shard }}/3
        env:
          CI: true

      - name: Summarize e2e tests
        id: playwright-summary
        if: always()
        run: node scripts/ci-summarize.mjs --playwright

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-release-${{ matrix.shard }}-results
          path: reports/playwright-results.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure() || steps.playwright-summary.outputs.retain-diagnostics == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-release-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            reports/playwright-results.json
            reports/current-run.*
            reports/runs/
          retention-days: 7

  package:
    outputs:
      artifact-id: ${{ steps.package-upload.outputs.artifact-id }}
    needs: [lint, test, e2e-full]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            node_modules/electron/dist
            node_modules/electron/path.txt
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Electron binary
        run: npm run ensure:electron

      - name: Verify release tag matches package.json
        run: node scripts/verify-release-version.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Generate patch notes
        run: node scripts/generate-patch-notes.mjs
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

      - name: Assert committed outputs match preparation
        run: npm run assets:check

      - name: Build desktop installers
        run: npm run dist:desktop
        env:
          CI_RELEASE: "true"
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CODE_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_CODE_SIGNING_PUBLISHER_NAME }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CODE_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CODE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          REQUIRE_CODE_SIGNING: ${{ vars.REQUIRE_CODE_SIGNING }}

      - name: Smoke test packaged Windows game
        timeout-minutes: 2
        run: npm run smoke:desktop

      - name: Retain verified release package
        id: package-upload
        uses: actions/upload-artifact@v7
        with:
          name: release-package-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            release-desktop/
            release-notes/${{ github.ref_name }}.md
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  release:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # The producer's ID remains valid when only this failed job is retried.
      - name: Download verified release package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          merge-multiple: true
          path: .

      # windows-latest does not ship SteamCMD; pin a known setup action by version tag.
      - name: Install SteamCMD
        uses: CyberAndrii/setup-steamcmd@v1.3.0

      - name: Steam upload
        shell: bash
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          STEAM_DEPOT_ID: ${{ secrets.STEAM_DEPOT_ID }}
          ALLOW_STEAM_DRY_RUN: ${{ vars.ALLOW_STEAM_DRY_RUN }}
        run: |
          if [ -z "$STEAM_USERNAME" ] || [ -z "$STEAM_PASSWORD" ] || [ -z "$STEAM_APP_ID" ] || [ -z "$STEAM_DEPOT_ID" ]; then
            if [ "$ALLOW_STEAM_DRY_RUN" = "true" ]; then
              echo "Steam credentials not configured — ALLOW_STEAM_DRY_RUN=true, running dry-run validation"
              npm run steam:upload:dry-run
            else
              echo "::error::Steam credentials are not configured. Set the STEAM_* secrets, or set repository variable ALLOW_STEAM_DRY_RUN=true to release without a Steam upload."
              exit 1
            fi
          else
            node scripts/steam-upload.mjs
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            release-desktop/*.exe
            release-desktop/*.exe.blockmap
            release-notes/**
          body_path: release-notes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
      - run: npx commitlint --from $(git tag --list "v*" --sort=-v:refname | head -1) --to HEAD --verbose

      - run: npm run lint:ci

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
      - run: mkdir -p reports
      - run: npx vitest run --reporter=default --reporter=json --outputFile=reports/vitest-timings.json

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: vitest-timings
          path: reports/vitest-timings.json
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
      - run: npm run build

      - name: Smoke test production build
        run: |
          npx vite preview --host 127.0.0.1 --port 4174 --strictPort &
          preview_pid=$!
          npx wait-on http://127.0.0.1:4174 --timeout 30000
          curl -sf http://127.0.0.1:4174 > /dev/null
          kill "$preview_pid"

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: |
            dist/
            !dist/Music/
          retention-days: 1

  e2e-full:
    needs: build
    name: E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium (with system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: npx playwright install chromium

      - name: Run full e2e shard
        run: npm run test:e2e:preview -- --shard=${{ matrix.shard }}/3
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-release-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3

  release:
    needs: [lint, test, e2e-full]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Verify release tag matches package.json
        run: node scripts/verify-release-version.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Sync version metadata
        run: node scripts/sync-version-metadata.mjs

      - name: Sync Steam App ID file
        run: node scripts/sync-steam-appid.mjs
        env:
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}

      - name: Ship gate
        run: npm run check:ship

      - name: Generate patch notes
        run: node scripts/generate-patch-notes.mjs
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

      - name: Build desktop installers
        run: npm run dist:desktop
        env:
          CI_RELEASE: "true"
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CODE_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_CODE_SIGNING_PUBLISHER_NAME }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CODE_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CODE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          REQUIRE_CODE_SIGNING: ${{ vars.REQUIRE_CODE_SIGNING }}

      - name: Steam upload
        shell: bash
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_APP_ID: ${{ secrets.STEAM_APP_ID }}
          STEAM_DEPOT_ID: ${{ secrets.STEAM_DEPOT_ID }}
          ALLOW_STEAM_DRY_RUN: ${{ vars.ALLOW_STEAM_DRY_RUN }}
        run: |
          if [ -z "$STEAM_USERNAME" ] || [ -z "$STEAM_PASSWORD" ] || [ -z "$STEAM_APP_ID" ] || [ -z "$STEAM_DEPOT_ID" ]; then
            if [ "$ALLOW_STEAM_DRY_RUN" = "true" ]; then
              echo "Steam credentials not configured — ALLOW_STEAM_DRY_RUN=true, running dry-run validation"
              npm run steam:upload:dry-run
            else
              echo "::error::Steam credentials are not configured. Set the STEAM_* secrets, or set repository variable ALLOW_STEAM_DRY_RUN=true to release without a Steam upload."
              exit 1
            fi
          else
            node scripts/steam-upload.mjs
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release-desktop/**
            release-notes/**
          body_path: release-notes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Setup Playwright Chromium
description: Cache and install the Playwright Chromium browser for the E2E jobs.

inputs:
  install-deps:
    description: Install OS system dependencies, including when browser binaries are cached.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright Chromium (with system deps)
      if: inputs.install-deps == 'true'
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Install Playwright Chromium
      if: inputs.install-deps == 'false'
      shell: bash
      run: npx playwright install chromium

    - name: Playwright install diagnostics
      if: failure()
      shell: bash
      run: |
        npx playwright install --dry-run || true
        ls -la ~/.cache/ms-playwright || true
